#####################################################################
# printune.cfg - Printune macros (tuning tests in one heat-soaked session)
#
# Add to printer.cfg:     [include printune.cfg]
# Needs in printer.cfg:   [exclude_object]  [pause_resume]  [respond]
#                         [firmware_retraction]  (only if the slice uses firmware retraction)
#                         [printune]  (the Kalico plugin, see install.sh)
# Start everything from the Printune page (Mainsail sidebar, works on a phone) or
# the PRINTUNE macro button. The first step is the machine setup: nothing prints until
# your bed area, toolhead box, gantry height and nozzle protrusion are entered and the risk is accepted. Both have the big blue Tuning Wizard button, a
# list of single tests and Advanced tuning. Prompts also show in Mainsail and recent Fluidd; without
# prompt support the console lists the commands to type (_PRINTUNE_PICK ..., _PRINTUNE_GO ...).
# PRINTUNE is the only macro meant to be clicked; the rest start with _ so
# Mainsail and Fluidd hide them.
#
# If you cancel a session half-way, run _PRINTUNE_RESET: it puts pressure advance,
# M221 flow, the M220 speed factor, firmware retraction and the idle timeout back.
#
# The session changes PA, flow and retraction only while it runs; at the end the
# printer's own values are back. Per-filament results belong in the Orca filament
# profile (the summary says which field), so swapping filament can't leave a stale
# firmware value behind.
# Optional record: with [save_variables] in printer.cfg every pick is also written
# to that file as you tap it (no restart). It is a log only, never loaded back;
# _PRINTUNE_SAVED lists it.
#
# Hands-on tests (no print needed; also on the Printune page):
#   _PRINTUNE_EXTRUDE_TEST            extruder calibration (100 mm at 1 mm/s)
#   _PRINTUNE_EXTRUDE_RESULT LEFT=21  -> new rotation_distance from what was left of 120 mm
#   _PRINTUNE_FLOW_TEST FLOW=20       max volumetric flow (100 mm at 20 mm3/s)
# Advanced tuning (after the wizard; same preset): the cooling test, the bridge test, then the
# max flow tower.
#   _PRINTUNE_MVS_AT HEIGHT=42.5      flow where the tower's wall got rough (or BAND=12)
#   _PRINTUNE_COOL_AT T=10            minimum layer time from the cone's 10 s marker
#####################################################################

#####################################################################
# The one button: PRINTUNE opens the menu (Tuning Wizard or one test)
#####################################################################
[gcode_macro PRINTUNE]
description: Printune: tune the printer and filaments (belts, Tuning Wizard, input shaper)
gcode:
  {% set busy = printer.print_stats.state in ['printing', 'paused'] %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Printune"
  {% if 'printune' not in printer %}
    RESPOND TYPE=command MSG="action:prompt_text The Printune plugin is not installed: run install.sh and add [printune] to printer.cfg."
  {% elif busy %}
    RESPOND TYPE=command MSG="action:prompt_text The printer is busy ({printer.print_stats.filename}). Open this menu again when it is done."
  {% else %}
    {% set tools = printer.printune.tools %}
    {% set ready = printer.printune.setup.ready %}
    RESPOND TYPE=command MSG="action:prompt_text Tune in this order: the machine setup, the belts, the Z offset, then the filament, then the input shaper. The Printune page in the sidebar does the same with more options and works well on a phone."
    {% if ready %}
      RESPOND TYPE=command MSG="action:prompt_button 1. Machine setup (done)|_PRINTUNE_SETUP_UI|secondary"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Machine setup first: Printune prints nothing until you have entered your bed area, toolhead size, gantry height and nozzle protrusion, measured on your printer, and accepted the risk."
      RESPOND TYPE=command MSG="action:prompt_button 1. Machine setup (required)|_PRINTUNE_SETUP_UI|primary"
    {% endif %}
    {% if tools.accel and tools.corexy %}
      RESPOND TYPE=command MSG="action:prompt_button 2. Belt tension|_PRINTUNE_BELTS|secondary"
    {% elif tools.corexy %}
      RESPOND TYPE=command MSG="action:prompt_button 2. Belt tension (needs an accelerometer)|_PRINTUNE_BELTS|info"
    {% endif %}
    {% if tools.zcal %}
      RESPOND TYPE=command MSG="action:prompt_button 3. Z offset|_PRINTUNE_ZCAL|secondary"
    {% endif %}
    {% set procs = printer.printune.procs %}
    {% set names = {'squish': 'First layer', 'pa': 'Pressure advance', 'em': 'Flow', 'ret': 'Retraction and temp', 'mvs': 'Max volumetric flow', 'cool': 'Cooling', 'bridge': 'Bridges'} %}
    {% set wl, al = [], [] %}
    {% for t in procs.wizard %}{% set _ = wl.append(names[t]|lower) %}{% endfor %}
    {% for t in procs.advanced %}{% set _ = al.append(names[t]|lower) %}{% endfor %}
    RESPOND TYPE=command MSG="action:prompt_text 4. Tune a filament: {wl|join(', ')}, with a pick after each test.{'' if ready else ' Locked until the machine setup is done.'}"
    {% if ready %}
      RESPOND TYPE=command MSG="action:prompt_button Tuning Wizard|_PRINTUNE_MENU STEP=type TESTS={procs.wizard|join(',')}|primary"
      RESPOND TYPE=command MSG="action:prompt_text Or run one test:"
      {% for t in procs.wizard %}
        {% if loop.index % 2 == 1 %}RESPOND TYPE=command MSG="action:prompt_button_group_start"{% endif %}
        RESPOND TYPE=command MSG="action:prompt_button {names[t]}|_PRINTUNE_MENU STEP=type TESTS={t}|secondary"
        {% if loop.index % 2 == 0 or loop.last %}RESPOND TYPE=command MSG="action:prompt_button_group_end"{% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_text Advanced tuning, for a filament the wizard has tuned: {al|join(', ')}. The results go into the same preset."
      RESPOND TYPE=command MSG="action:prompt_button Advanced tuning|_PRINTUNE_MENU STEP=type TESTS={procs.advanced|join(',')}|secondary"
      {% for t in procs.advanced %}
        {% if loop.index % 2 == 1 %}RESPOND TYPE=command MSG="action:prompt_button_group_start"{% endif %}
        RESPOND TYPE=command MSG="action:prompt_button {names[t]}|_PRINTUNE_MENU STEP=type TESTS={t}|secondary"
        {% if loop.index % 2 == 0 or loop.last %}RESPOND TYPE=command MSG="action:prompt_button_group_end"{% endif %}
      {% endfor %}
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_button Tuning Wizard (locked - machine setup first)|_PRINTUNE_SETUP_UI|info"
      RESPOND TYPE=command MSG="action:prompt_button Single tests and Advanced tuning (locked)|_PRINTUNE_SETUP_UI|info"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text 5. When the filament is tuned: input shaper, and Shake&Tune graphs if installed."
    RESPOND TYPE=command MSG="action:prompt_button 5. Input shaper{'' if tools.accel else ' (needs an accelerometer)'}|_PRINTUNE_SHAPER|{'secondary' if tools.accel else 'info'}"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Extruder calibration|_PRINTUNE_MENU STEP=extrude|info"
    RESPOND TYPE=command MSG="action:prompt_button Reset after cancel|_PRINTUNE_RESET|info"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PRINTUNE_MENU]
description: Printune: menu steps (buttons only; the Printune page has the full form)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set step = params.STEP|default('type')|lower %}
  {% set fils = printer.printune.filaments %}
  {% if params.TESTS is defined %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=m_tests VALUE="'{params.TESTS|lower}'"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if step == 'type' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - which filament?"
    RESPOND TYPE=command MSG="action:prompt_text Load the filament and clean the plate. Pick its type:"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for t in fils %}
      RESPOND TYPE=command MSG="action:prompt_button {t}|_PRINTUNE_MENU STEP=temp TYPE={t}|primary"
      {% if loop.index % 4 == 0 and not loop.last %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'temp' %}
    {% if params.TYPE is defined %}
      {% set t = params.TYPE|upper %}
      {% set f = fils[t] %}
      {% set tmin, tmax, bed = f.tmin, f.tmax, f.bed %}
      {% set soak = f.soak if printer.printune.enclosed else 0 %}
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=m_type VALUE="'{t}'"
    {% else %}
      {% set t = S.m_type %}
      {% set tmin = [[S.m_tmin + params.DMIN|default(0)|int, 150]|max, 350]|min %}
      {% set tmax = [[S.m_tmax + params.DMAX|default(0)|int, 150]|max, 350]|min %}
      {% set bed = [[S.m_bed + params.DBED|default(0)|int, 0]|max, 130]|min %}
      {% set soak = (1 - S.m_soak) if params.SOAK is defined else S.m_soak %}
    {% endif %}
    {% if tmax < tmin %}{% set tmin, tmax = tmax, tmin %}{% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=m_tmin VALUE={tmin}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=m_tmax VALUE={tmax}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=m_bed VALUE={bed}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=m_soak VALUE={soak}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - {t} temperatures"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {tmin} to {tmax} C (from the filament's box), bed {bed} C. The preset will be called '{t} Printune' (advanced tuning adds to the same one); rename it in Orca or use the Printune page to name it."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Low -5|_PRINTUNE_MENU STEP=temp DMIN=-5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Low +5|_PRINTUNE_MENU STEP=temp DMIN=5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button High -5|_PRINTUNE_MENU STEP=temp DMAX=-5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button High +5|_PRINTUNE_MENU STEP=temp DMAX=5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button Bed -5|_PRINTUNE_MENU STEP=temp DBED=-5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Bed +5|_PRINTUNE_MENU STEP=temp DBED=5|secondary"
    {% if printer.printune.enclosed %}
      RESPOND TYPE=command MSG="action:prompt_button Heat soak: {'on' if soak else 'off'}|_PRINTUNE_MENU STEP=temp SOAK=1|secondary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button Start|_PRINTUNE_MENU STEP=go|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_PRINTUNE_MENU STEP=type|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'go' and not printer.printune.setup.ready %}
    _PRINTUNE_SETUP_UI
  {% elif step == 'go' %}
    _PRINTUNE_START TYPE={S.m_type} TMIN={S.m_tmin} TMAX={S.m_tmax} BED={S.m_bed} SOAK={S.m_soak} TESTS={S.m_tests}
  {% elif step == 'extrude' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - extruder calibration"
    RESPOND TYPE=command MSG="action:prompt_text Heat the nozzle, mark the filament 120 mm above the extruder, then extrude 100 mm. Measure what is left to the mark and type _PRINTUNE_EXTRUDE_RESULT LEFT=<mm> (or use the Printune page)."
    RESPOND TYPE=command MSG="action:prompt_text This extrudes in the air and does not move over the bed, so it does not need the machine setup."
    RESPOND TYPE=command MSG="action:prompt_button Extrude 100 mm|_PRINTUNE_EXTRUDE_TEST|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

#####################################################################
# Machine setup (pre-flight, step 1): the bed area, the toolhead box, the gantry height
# and the nozzle protrusion, measured by the user, and the risk notice. The plugin
# refuses to build any test print until all of it is set, and _PRINTUNE_BEGIN refuses
# to run a session made for other values (_PRINTUNE_SETUP saves it under [printune]
# with SAVE_CONFIG). The Printune page has the full form with drawings; here the
# numbers are typed in the console:
#   _PRINTUNE_SETUP BED=mesh TOOLHEAD=-30,30,-40,25 GANTRY=42 PROTRUSION=3   (your numbers)
#   _PRINTUNE_SETUP ACCEPT=1 SAVE=1
#####################################################################
[gcode_macro _PRINTUNE_SETUP_UI]
description: Printune: machine setup prompt (the Printune page has the full form)
gcode:
  {% set su = printer.printune.setup %}
  {% set have = su.bed_area and su.toolhead_box and su.gantry_height and su.nozzle_protrusion is not none %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin Printune - machine setup"
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND TYPE=command MSG="action:prompt_text The printer is busy. Change the machine setup when it is done."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text Printune prints several tests on one plate, one after the other. It keeps the toolhead and the X gantry off the finished prints with four numbers that you measure on your printer. Printune assumes none of them. The Printune page shows how to measure them, with a drawing."
    {% if su.bed_area %}
      {% set b = su.bed_area %}
      RESPOND TYPE=command MSG="action:prompt_text Bed area (where the nozzle may print): X {'%g' % b[0]} to {'%g' % b[2]}, Y {'%g' % b[1]} to {'%g' % b[3]} mm"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Bed area: not set.{(' ' ~ su.bed_hint_note ~ '.') if su.bed_hint_note else ''}"
    {% endif %}
    {% if su.bed_hint and su.bed_hint != su.bed_area %}
      {% set h = su.bed_hint %}
      RESPOND TYPE=command MSG="action:prompt_button Use the bed mesh area (X {'%g' % h[0]} to {'%g' % h[2]}, Y {'%g' % h[1]} to {'%g' % h[3]})|_PRINTUNE_SETUP BED=mesh UI=1|secondary"
    {% endif %}
    {% if su.toolhead_box %}
      {% set t = su.toolhead_box %}
      RESPOND TYPE=command MSG="action:prompt_text Toolhead box around the nozzle: -X {'%g' % (-t[0])}, +X {'%g' % t[1]}, -Y {'%g' % (-t[2])}, +Y {'%g' % t[3]} mm"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Toolhead box: not set. From the nozzle to the furthest point of the toolhead toward -X, +X, -Y and +Y: fans, ducts, probe and carriage included, and the X beam where it reaches further in Y."
    {% endif %}
    {% if su.gantry_height %}
      RESPOND TYPE=command MSG="action:prompt_text Gantry height: {'%g' % su.gantry_height} mm (bed to the underside of the X gantry, nozzle at Z=0)"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Gantry height: not set. From the bed to the underside of the X gantry with the nozzle at Z=0 (measure at Z=50 and take 50 off)."
    {% endif %}
    {% if su.nozzle_protrusion is not none %}
      RESPOND TYPE=command MSG="action:prompt_text Nozzle protrusion: {'%g' % su.nozzle_protrusion} mm (nozzle tip up to the lowest other part of the toolhead). Finished prints up to {'%g' % ([su.nozzle_protrusion - su.low_margin, 0]|max)} mm tall may sit under the toolhead."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Nozzle protrusion: not set. From the nozzle tip up to the lowest other part of the toolhead: fan duct, probe, silicone sock. With the hotend cold, lower the nozzle onto a flat card on the bed and measure the gap from the card to that part, or measure it with calipers."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Type your numbers in the console, for example: _PRINTUNE_SETUP TOOLHEAD=-30,30,-40,25 GANTRY=42 PROTRUSION=3 BED=10,10,340,340 (the format only: use your own measurements)."
    {% if have and not su.accepted %}
      RESPOND TYPE=command MSG="action:prompt_text Printune and its authors take zero responsibility for the G-code it generates, for collisions or for any damage. It comes without any warranty (GPL-3.0, sections 15 and 16). Accept only if you measured these values yourself.{(' Note: ' ~ su.accept_note ~ '.') if su.accept_note else ''}"
      RESPOND TYPE=command MSG="action:prompt_button I measured them myself and accept the risk|_PRINTUNE_SETUP ACCEPT=1 SAVE=1 UI=1|warning"
    {% elif su.accepted %}
      RESPOND TYPE=command MSG="action:prompt_text Done: you accepted the risk for these values.{' Not saved to printer.cfg yet.' if su.unsaved else ''}"
      {% if su.unsaved %}
        RESPOND TYPE=command MSG="action:prompt_button Save to printer.cfg|_PRINTUNE_SETUP SAVE=1 UI=1|primary"
      {% endif %}
    {% endif %}
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

#####################################################################
# Z offset: the printer's own routine sets the starting Z offset (pre-flight).
# The first layer test in the Tuning Wizard then fine-tunes it while printing.
#####################################################################
[gcode_macro _PRINTUNE_ZCAL]
description: Printune: set the starting Z offset with the printer's own routine (buttons only)
gcode:
  {% set step = params.STEP|default('info')|lower %}
  {% set z = printer.printune.tools.zcal %}
  {% set cmd = {'probe': 'PROBE_CALIBRATE', 'beacon': 'BEACON_CALIBRATE', 'endstop': 'Z_ENDSTOP_CALIBRATE'}[z]|default('') %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if not cmd %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - Z offset"
    RESPOND TYPE=command MSG="action:prompt_text This printer has no probe and no Z endstop routine (PROBE_CALIBRATE or Z_ENDSTOP_CALIBRATE). Set the Z offset as your printer's guide says; the first layer test fine-tunes it."
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif printer.print_stats.state in ['printing', 'paused'] %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - Z offset"
    RESPOND TYPE=command MSG="action:prompt_text The printer is busy. Run this when it is done."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'info' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - Z offset"
    RESPOND TYPE=command MSG="action:prompt_text Sets the starting Z offset with {cmd}. Do it after the belts, and again after a nozzle or build plate swap. Clean the nozzle tip and keep it cold; have a sheet of paper ready."
    RESPOND TYPE=command MSG="action:prompt_text Printune homes{', levels the gantry' if z != 'beacon' and (printer.z_tilt is defined or printer.quad_gantry_level is defined) else ''} and moves to the middle of the bed. Mainsail or Fluidd then opens a Z dialog: lower the nozzle until the paper drags slightly under it, press Accept, then Save config (Kalico restarts)."
    RESPOND TYPE=command MSG="action:prompt_text The first layer test in the Tuning Wizard fine-tunes this offset while printing."
    RESPOND TYPE=command MSG="action:prompt_button Start|_PRINTUNE_ZCAL STEP=run|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'run' %}
    {% set th = printer.toolhead %}
    RESPOND MSG="Printune: Z offset with {cmd}"
    G90
    {% if z == 'beacon' %}
      # Beacon's own calibration: X and Y homed only, it finds Z with the paper test
      G28 X Y
    {% else %}
      G28
      {% if printer.quad_gantry_level is defined %}
        QUAD_GANTRY_LEVEL
        G28 Z
      {% elif printer.z_tilt is defined %}
        Z_TILT_ADJUST
        G28 Z
      {% endif %}
      G1 Z10 F600
    {% endif %}
    G1 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{(th.axis_minimum.y + th.axis_maximum.y) / 2} F6000
    {cmd}
  {% endif %}

#####################################################################
# Belt tension: pluck each belt, the toolhead accelerometer hears it
#####################################################################
[gcode_macro _PRINTUNE_BELTS]
description: Printune: belt tension from plucks (buttons only)
variable_target: 0
variable_plucks: 5
gcode:
  {% set pt = printer.printune %}
  {% set step = params.STEP|default('setup')|lower %}
  {% set tgt = target if target > 0 else pt.belt_target %}
  {% set b = pt.belts %}
  {% set xy = pt.tools.corexy %}
  {% set nm = {'A': 'A (stepper_x)', 'B': 'B (stepper_y)'} if xy else {'A': 'X', 'B': 'Y'} %}
  {% if step != 'pluck' %}
    RESPOND TYPE=command MSG="action:prompt_end"
  {% endif %}
  {% if not pt.tools.accel or not xy %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - belt tension"
    {% if not xy %}
      RESPOND TYPE=command MSG="action:prompt_text The belt step is made for CoreXY printers, where both belts pull the toolhead and must match."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Printune listens to the belts with an accelerometer on the toolhead (an ADXL345 or LIS2DW board, or a probe with one built in). None is set up: add one and [resonance_tester] to printer.cfg. How: Kalico docs, Measuring Resonances."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'setup' %}
    {% if params.DT is defined %}
      {% set tgt = [[tgt + params.DT|float, 40]|max, 300]|min %}
      SET_GCODE_VARIABLE MACRO=_PRINTUNE_BELTS VARIABLE=target VALUE={tgt}
    {% endif %}
    {% set n = params.PLUCKS|default(plucks)|int %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE_BELTS VARIABLE=plucks VALUE={n}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - belt tension"
    RESPOND TYPE=command MSG="action:prompt_text Printune parks the toolhead in the middle and listens with the accelerometer while you pluck a belt like a guitar string. It averages {n} plucks per belt.{' CoreXY belts pull on each other, so both are measured after every turn of a tensioner.' if xy else ''}"
    RESPOND TYPE=command MSG="action:prompt_text Before you start: check that the gantry is square, and turn off loud fans if you can."
    RESPOND TYPE=command MSG="action:prompt_text Target: {'%.0f'|format(tgt)} Hz. Use the value your printer's build guide gives, and pluck the same stretch of belt it measures (its length matters: the same tension rings lower on a longer stretch)."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button -5 Hz|_PRINTUNE_BELTS DT=-5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button -1|_PRINTUNE_BELTS DT=-1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button +1|_PRINTUNE_BELTS DT=1|secondary"
    RESPOND TYPE=command MSG="action:prompt_button +5 Hz|_PRINTUNE_BELTS DT=5|secondary"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button 3 plucks|_PRINTUNE_BELTS PLUCKS=3|{'primary' if n == 3 else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button 5 plucks|_PRINTUNE_BELTS PLUCKS=5|{'primary' if n == 5 else 'secondary'}"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button Start|_PRINTUNE_BELTS STEP=start|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'start' %}
    {% if printer.toolhead.homed_axes != 'xyz' %}
      G28
    {% endif %}
    {% set mn, mx = printer.toolhead.axis_minimum, printer.toolhead.axis_maximum %}
    SAVE_GCODE_STATE NAME=_printune_belts
    G90
    {% if printer.toolhead.position.z < 20 %}
      G1 Z20 F600
    {% endif %}
    G1 X{(mn.x + mx.x) / 2} Y{(mn.y + mx.y) / 2} F6000
    RESTORE_GCODE_STATE NAME=_printune_belts
    M106 S0
    M400
    _PRINTUNE_BELTS_START TARGET={tgt} PLUCKS={plucks}
    _PRINTUNE_BELTS_UI STEP=tap
  {% elif step == 'tap' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - tap the toolhead"
    RESPOND TYPE=command MSG="action:prompt_text Hands off the printer for a moment..."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
    _PRINTUNE_BELT_TAP UI=1
    _PRINTUNE_BELTS_UI STEP=tapped
  {% elif step == 'listen' %}
    {% set k = params.BELT|default('A')|upper %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - belt {nm[k]}"
    RESPOND TYPE=command MSG="action:prompt_text Hands off the printer for a moment..."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
    _PRINTUNE_BELT_LISTEN BELT={k} UI=1
    _PRINTUNE_BELTS_UI STEP=result BELT={k}
  {% endif %}

[gcode_macro _PRINTUNE_BELTS_UI]
description: Printune: belt tension prompts
gcode:
  {% set pt = printer.printune %}
  {% set step = params.STEP|default('ready')|lower %}
  {% set b = pt.belts %}
  {% set xy = pt.tools.corexy %}
  {% set nm = {'A': 'A (stepper_x)', 'B': 'B (stepper_y)'} if xy else {'A': 'X', 'B': 'Y'} %}
  {% if step != 'pluck' %}
    RESPOND TYPE=command MSG="action:prompt_end"
  {% endif %}
  {% if step == 'tap' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - tap the toolhead"
    RESPOND TYPE=command MSG="action:prompt_text First, one light tap on the toolhead with a fingertip. The toolhead rings a little by itself; Printune learns that tone so a knock is never taken for a belt."
    RESPOND TYPE=command MSG="action:prompt_text Tap Listen, keep your hands off for a moment, then tap the toolhead once when asked. Don't touch the belts."
    RESPOND TYPE=command MSG="action:prompt_button Listen for the tap|_PRINTUNE_BELTS STEP=tap|primary"
    RESPOND TYPE=command MSG="action:prompt_button Skip|_PRINTUNE_BELTS_UI STEP=ready BELT=A|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Stop|_PRINTUNE_BELTS_UI STEP=stop|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'tapnow' %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Printune - tap now"
    RESPOND TYPE=command MSG="action:prompt_text Tap the toolhead once, lightly."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'tapped' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - tap the toolhead"
    {% if b.tap %}
      RESPOND TYPE=command MSG="action:prompt_text The toolhead rings by itself at {b.tap|map('round', 1)|join(' and ')} Hz. Printune ignores that when it listens to the belts."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text No clear ringing heard ({b.tap_note}). Fine if the toolhead is stiff; tap again if you didn't tap."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Continue to belt A|_PRINTUNE_BELTS_UI STEP=ready BELT=A|primary"
    RESPOND TYPE=command MSG="action:prompt_button Tap again|_PRINTUNE_BELTS STEP=tap|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Stop|_PRINTUNE_BELTS_UI STEP=stop|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'ready' %}
    {% set k = params.BELT|default('A')|upper %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - belt {nm[k]}"
    {% if b.advice and k == 'A' and b.round > 0 %}
      RESPOND TYPE=command MSG="action:prompt_text {b.advice}"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Pluck belt {nm[k]} in the middle of the stretch your target is for, with a finger or a plastic tool (metal can nick the teeth), not too hard. Tap Listen, keep your hands off for a moment, then pluck {b.plucks} times when asked, about once a second."
    RESPOND TYPE=command MSG="action:prompt_button Listen to belt {k}|_PRINTUNE_BELTS STEP=listen BELT={k}|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Stop|_PRINTUNE_BELTS_UI STEP=stop|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'pluck' %}
    {% set k = params.BELT|default('A')|upper %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Printune - pluck belt {nm[k]} now"
    RESPOND TYPE=command MSG="action:prompt_text Pluck belt {nm[k]} {b.plucks} times, about once a second."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'result' %}
    {% set k = params.BELT|default('A')|upper %}
    {% set r = b[k] if b and b[k] else {'freq': none, 'note': 'no reading'} %}
    {% if not b %}
      RESPOND TYPE=command MSG="action:prompt_begin Printune - belt tension"
      RESPOND TYPE=command MSG="action:prompt_text Kalico restarted since the belt step began. Start it again from the PRINTUNE menu."
    {% elif r.freq is none %}
      RESPOND TYPE=command MSG="action:prompt_begin Printune - belt {nm[k]}: no reading"
      {% if b.deaf %}
        RESPOND TYPE=command MSG="action:prompt_text The accelerometer can't hear the belts well ({r.note}). Check that it is mounted firmly, or measure the belts with a phone app instead."
      {% elif r.verdict == 'spread' %}
        RESPOND TYPE=command MSG="action:prompt_text Not counted: {r.note}. Pluck the same spot each time, and don't touch the belt while it rings."
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Not counted: {r.note} (3 are needed). Pluck a bit firmer, in the middle of the stretch, about once a second."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button Listen again|_PRINTUNE_BELTS STEP=listen BELT={k}|primary"
    {% elif b.heard or not b.A or not b.B or b.A.freq is none or b.B.freq is none %}
      {% set o = 'B' if k == 'A' else 'A' %}
      RESPOND TYPE=command MSG="action:prompt_begin Printune - belt {nm[k]}: {'%.1f'|format(r.freq)} Hz"
      RESPOND TYPE=command MSG="action:prompt_text Belt {k}: {'%.1f'|format(r.freq)} Hz, {r.note} (target {'%.0f'|format(b.target)} Hz)."
      RESPOND TYPE=command MSG="action:prompt_text Now belt {nm[o]}. Don't change anything yet."
      RESPOND TYPE=command MSG="action:prompt_button Listen to belt {o}|_PRINTUNE_BELTS STEP=listen BELT={o}|primary"
    {% else %}
      {% set fa, fb = b.A.freq, b.B.freq %}
      RESPOND TYPE=command MSG="action:prompt_begin Printune - belts {'%.1f'|format(fa)} / {'%.1f'|format(fb)} Hz"
      {% for kk in ['A', 'B'] %}
        {% set d = b[kk].freq - b.target %}
        RESPOND TYPE=command MSG="action:prompt_text Belt {nm[kk]}: {'%.1f'|format(b[kk].freq)} Hz, {'on target' if d|abs <= b.tol else ('%.1f Hz %s'|format(d|abs, 'low' if d < 0 else 'high'))} ({b[kk].used} of {b[kk].heard} plucks counted)"
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_text {b.advice}"
      {% if b.done %}
        RESPOND TYPE=command MSG="action:prompt_button Finish|_PRINTUNE_BELTS_UI STEP=stop|primary"
        {% if xy and pt.tools.shaketune %}
          RESPOND TYPE=command MSG="action:prompt_button Check with a Shake&Tune belt graph|_PRINTUNE_SHAPER STEP=st_belts|secondary"
        {% elif xy %}
          RESPOND TYPE=command MSG="action:prompt_button Shake&Tune belt graph (not installed)|_PRINTUNE_SHAPER_UI STEP=nost|info"
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button Measure both again|_PRINTUNE_BELTS_UI STEP=ready BELT=A|secondary"
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_button Done turning - measure both again|_PRINTUNE_BELTS_UI STEP=ready BELT=A|primary"
      {% endif %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Stop|_PRINTUNE_BELTS_UI STEP=stop|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'stop' %}
    {% if b.done %}
      RESPOND MSG="Printune: belts done: A {'%.1f'|format(b.A.freq)} Hz, B {'%.1f'|format(b.B.freq)} Hz (target {'%.0f'|format(b.target)} Hz). Next: tune a filament (PRINTUNE)."
    {% endif %}
  {% endif %}

#####################################################################
# Input shaper: Kalico's SHAPER_CALIBRATE, Shake&Tune graphs if installed
#####################################################################
[gcode_macro _PRINTUNE_SHAPER]
description: Printune: input shaper and Shake&Tune (buttons only)
gcode:
  {% set pt = printer.printune %}
  {% set tools = pt.tools %}
  {% set step = params.STEP|default('setup')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if step == 'setup' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - input shaper"
    {% if not tools.accel %}
      RESPOND TYPE=command MSG="action:prompt_text Measuring the input shaper needs an accelerometer on the toolhead and [resonance_tester] in printer.cfg (Kalico docs: Measuring Resonances). Without one, print Kalico's ringing tower (Kalico docs: Resonance Compensation)."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Kalico shakes the toolhead along X and Y, measures the resonances and picks a shaper for each axis. It takes a few minutes and is loud. Tension the belts first: they change the result."
      {% if not tools.input_shaper %}
        RESPOND TYPE=command MSG="action:prompt_text Add an empty [input_shaper] section to printer.cfg, so the result can be applied and saved."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button Measure|_PRINTUNE_SHAPER STEP=run|primary"
      {% if tools.shaketune %}
        RESPOND TYPE=command MSG="action:prompt_button Shake&Tune shaper graphs|_PRINTUNE_SHAPER STEP=st_axes|secondary"
        {% if tools.corexy %}
          RESPOND TYPE=command MSG="action:prompt_button Shake&Tune belt graph|_PRINTUNE_SHAPER STEP=st_belts|secondary"
        {% endif %}
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_button Shake&Tune graphs (not installed)|_PRINTUNE_SHAPER_UI STEP=nost|info"
      {% endif %}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step in ['run', 'st_axes', 'st_belts'] %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - measuring"
    RESPOND TYPE=command MSG="action:prompt_text The printer shakes for a few minutes. Keep hands off it and leave the door closed if it has one."
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
    {% if printer.toolhead.homed_axes != 'xyz' %}
      G28
    {% endif %}
    M106 S0
    {% if step == 'run' %}
      _PRINTUNE_SHAPER_RUN UI=1
      _PRINTUNE_SHAPER_UI STEP=result
    {% elif step == 'st_axes' %}
      _PRINTUNE_GRAPH MARK=1 KIND=input_shaper
      AXES_SHAPER_CALIBRATION
      _PRINTUNE_GRAPH KIND=input_shaper
      _PRINTUNE_SHAPER_UI STEP=graph KIND=shaper
    {% else %}
      _PRINTUNE_GRAPH MARK=1 KIND=belts
      COMPARE_BELTS_RESPONSES
      _PRINTUNE_GRAPH KIND=belts
      _PRINTUNE_SHAPER_UI STEP=graph KIND=belts
    {% endif %}
  {% endif %}

[gcode_macro _PRINTUNE_SAVE_CONFIG]
description: Printune: close the prompt, then SAVE_CONFIG (restarts Kalico)
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  SAVE_CONFIG

[gcode_macro _PRINTUNE_SHAPER_UI]
description: Printune: input shaper prompts
gcode:
  {% set pt = printer.printune %}
  {% set step = params.STEP|default('result')|lower %}
  {% set sh = pt.shaper %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if step == 'result' and sh.new %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - input shaper measured"
    {% for a in ['x', 'y'] if a in sh.new %}
      {% set r = sh.new[a] %}
      {% set o = sh.old[a] if a in sh.old else none %}
      RESPOND TYPE=command MSG="action:prompt_text {a|upper}: {r.type} at {'%.1f'|format(r.freq)} Hz{('; printer.cfg has %s at %.1f Hz'|format(o.type, o.freq)) if o else ''}."
    {% endfor %}
    {% if sh.max_accel %}
      RESPOND TYPE=command MSG="action:prompt_text Keep acceleration at or below {'%.0f'|format(sh.max_accel)} mm/s2 (max_accel in printer.cfg and in the Orca printer profile), or corners get rounded."
    {% endif %}
    {% if pt.tools.input_shaper %}
      RESPOND TYPE=command MSG="action:prompt_text The shaper is on now, until Kalico restarts. Save writes it to printer.cfg and restarts Kalico."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Save writes it to printer.cfg and restarts Kalico; the shaper is on after that."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Save to printer.cfg|_PRINTUNE_SAVE_CONFIG|primary"
    {% if sh.changed %}
      RESPOND TYPE=command MSG="action:prompt_text The shaper changed, so corners print a little differently: re-check pressure advance after saving."
      RESPOND TYPE=command MSG="action:prompt_button Re-check pressure advance|_PRINTUNE_MENU STEP=type TESTS=pa|secondary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'graph' %}
    {% set kind = params.KIND|default('belts') %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - Shake&Tune {'belt' if kind == 'belts' else 'shaper'} graph"
    {% if pt.graphs %}
      RESPOND TYPE=command MSG="action:prompt_text Saved in {pt.graphs[0].rsplit('/', 1)[0]}: {pt.graphs|map('replace', pt.graphs[0].rsplit('/', 1)[0] ~ '/', '')|join(', ')} (in Mainsail: Machine, ShakeTune_results)."
      {% if kind == 'belts' %}
        RESPOND TYPE=command MSG="action:prompt_text Look for two curves of the same shape with their peaks at the same frequency. A big gap means one belt is tighter or a pulley or bearing on its path drags."
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_text The graph shows each axis' resonances and the shapers that fit them. To use its pick instead of Kalico's, set it in [input_shaper] in printer.cfg."
      {% endif %}
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Shake&Tune finished but no graph was found. Check the console for its messages."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_PRINTUNE_SHAPER|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% elif step == 'nost' %}
    RESPOND TYPE=command MSG="action:prompt_begin Printune - Shake&Tune"
    RESPOND TYPE=command MSG="action:prompt_text Shake&Tune is not installed. It draws graphs of the belts and resonances from the accelerometer. Get it from github.com/Frix-x/klippain-shaketune; Printune then runs it at the right step."
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|PRINTUNE|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

#####################################################################
# Heat soak (the wizard puts _PRINTUNE_SOAK before the start G-code)
#####################################################################
[gcode_macro _PRINTUNE_SOAK]
description: Printune: heat the bed with the toolhead parked far from it, wait for the temperature to level off
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set th = printer.toolhead %}
  {% if not S.keep_idle %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=idle0 VALUE={printer.idle_timeout.idle_timeout|default(600)|float}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=keep_idle VALUE=1
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=soak_nozzle VALUE={params.NOZZLE|default(0)|int}
  SET_IDLE_TIMEOUT TIMEOUT=10800
  {% if th.homed_axes != 'xyz' %}
    G28
  {% endif %}
  M104 S0
  M140 S{params.BED|default(100)|int}
  G90
  G1 Z{th.axis_maximum.z - 10} F600
  G1 X{(th.axis_minimum.x + th.axis_maximum.x) / 2} Y{(th.axis_minimum.y + th.axis_maximum.y) / 2} F6000
  M117 Printune soak
  _PRINTUNE_SOAK_WAIT
  RESPOND TYPE=command MSG="action:prompt_begin Printune - heat soak"
  RESPOND TYPE=command MSG="action:prompt_text Heating the enclosure. The tests start by themselves when the temperature levels off."
  RESPOND TYPE=command MSG="action:prompt_button Skip the soak|_PRINTUNE_SOAK_SKIP|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"
  PAUSE
  # a PAUSE macro may set its own idle timeout; the pick can take a while
  SET_IDLE_TIMEOUT TIMEOUT=10800

[gcode_macro _PRINTUNE_SOAK_DONE]
description: Printune: end of the heat soak (the plugin calls this)
gcode:
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND MSG="Printune: heat soak done ({params.MSG|default('')})"
  M117 Printune
  {% if printer.pause_resume.is_paused %}
    # RESUME macros (Mainsail's, Fluidd's) refuse to resume with a cold hotend
    {% set t = printer["gcode_macro _PRINTUNE"].soak_nozzle %}
    {% set ex = printer.toolhead.extruder %}
    M109 S{t if t > 0 else printer.configfile.settings[ex].min_extrude_temp + 10}
    RESUME
  {% endif %}

[gcode_macro _PRINTUNE]
description: Printune state, do not call
variable_version: 9
variable_active: 0
variable_loaded: 0
variable_fw: 1
variable_pa: 0.0
variable_pa0: 0.0
variable_em: 1.0
variable_pfr: 1.0
variable_z0: 0.0
variable_idle0: 600.0
variable_r_len: 0.0
variable_r_speed: 30.0
variable_r_uspeed: 30.0
variable_r_extra: 0.0
variable_ret_len: 0.0
variable_ret_speed: 30.0
variable_ret_temp: 0
variable_rd: 0.0
variable_tested: ''
variable_plate: 1
variable_keep_idle: 0
variable_soak_nozzle: 0
variable_m_type: 'PLA'
variable_m_tests: 'squish,pa,em,ret'
variable_steps: ''
variable_titles: {}
variable_more: ''
variable_mvs: 0.0
variable_mvs_flows: ''
variable_mvs_base: 0.0
variable_mvs_band: 0.0
variable_cool_fan: -1
variable_cool_lt: 0.0
variable_cool_times: ''
variable_cool_top: 1.0
variable_cool_fan0: 0
variable_cool_type: ''
variable_br_fan: -1
variable_br_speed: 0.0
variable_br_flow: 0.0
variable_br_fans: ''
variable_br_base: 0
variable_m_tmin: 0
variable_m_tmax: 0
variable_m_bed: 0
variable_m_soak: 0
gcode:
  RESPOND MSG="Printune state: pa={pa} em={em} retraction={ret_len}mm@{ret_speed} temp={ret_temp}"

[gcode_macro _PRINTUNE_BEGIN]
description: Printune: start of a session (called by the G-code)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set ex = printer.toolhead.extruder %}
  {% set fw = params.FW|default(1)|int %}
  {% if params.VERSION|default(0)|int != S.version %}
    {action_raise_error("Printune: printune.cfg is version %d but this G-code needs version %s - copy the matching cfg, or make the session again" % (S.version, params.VERSION|default('?')))}
  {% endif %}
  # With the plugin loaded, every session (made on the printer, in Orca or by hand) must match the
  # saved, accepted machine setup: GEOM is the fingerprint of the geometry it was laid out for.
  {% if 'printune' in printer %}
    {% set su = printer.printune.setup %}
    {% if not su.ready %}
      {action_raise_error("Printune: the machine setup is not done (missing: %s): this session does not start until it is. Open Machine setup on the Printune page or in the PRINTUNE menu" % (su.missing_text))}
    {% endif %}
    {% if params.GEOM|default('') != su.hash %}
      {action_raise_error("Printune: this session was made for another machine geometry than your machine setup (%s), so it does not start. Make it again with these values (the session's own are in its header, line printune_geometry)" % (su.summary))}
    {% endif %}
  {% endif %}
  {% if fw and 'firmware_retraction' not in printer %}
    {action_raise_error("Printune: the slice uses firmware retraction but [firmware_retraction] is not in printer.cfg")}
  {% endif %}
  {% if 'exclude_object' not in printer %}
    {action_raise_error("Printune: add [exclude_object] to printer.cfg")}
  {% endif %}
  {% if 'pause_resume' not in printer %}
    {action_raise_error("Printune: add [pause_resume] to printer.cfg")}
  {% endif %}
  # A session that was cancelled without _PRINTUNE_RESET left test values in the printer:
  # keep the originals it recorded instead of recording the leftovers.
  {% set stale = S.active %}
  {% set pa0 = S.pa0 if stale else printer[ex].pressure_advance %}
  {% set pa = params.PA|default(-1)|float %}
  {% if pa < 0 %}{% set pa = pa0 %}{% endif %}
  {% if stale %}
    RESPOND MSG="Printune: an unfinished session was found; using the settings it saved from before it."
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=plate VALUE=1
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=fw VALUE={fw}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=pa0 VALUE={pa0}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=pa VALUE={pa}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=em VALUE={params.EM|default(1)|float}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=ret_len VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=ret_temp VALUE=0
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=more VALUE="''"
  # the tests of this session in order, and each one's prompt title ("Printune 2/4", "Advanced 1/2")
  {% set steps = (params.STEPS|default('')|lower).split(',')|reject('equalto', '')|list %}
  {% set word = params.PROC|default('Printune') %}
  {% set titles = {} %}
  {% for t in steps %}
    {% set _ = titles.update({t: ('%s %d/%d' % (word, loop.index, steps|length)) if steps|length > 1 else 'Printune'}) %}
  {% endfor %}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=steps VALUE="'{steps|join(',')}'"
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=titles VALUE="{titles}"
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=mvs VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=mvs_flows VALUE="''"
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_fan VALUE=-1
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_lt VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_times VALUE="''"
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_fan VALUE=-1
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_speed VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_flow VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_fans VALUE="''"
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=tested VALUE="''"
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=pfr VALUE={params.PFR|default(1)|float}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=z0 VALUE={printer.gcode_move.homing_origin.z}
  {% if not stale and not S.keep_idle %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=idle0 VALUE={printer.idle_timeout.idle_timeout|default(600)|float}
  {% endif %}
  {% if fw and not (stale and S.fw) %}
    {% set r = printer.firmware_retraction %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=r_len VALUE={r.retract_length}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=r_speed VALUE={r.retract_speed}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=r_uspeed VALUE={r.unretract_speed}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=r_extra VALUE={r.unretract_extra_length}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=keep_idle VALUE=0
  # Arm exclude_object now: it lets the first 5 extrusions after its first EXCLUDE_OBJECT
  # through, which would otherwise leak into the first optional part you skip.
  EXCLUDE_OBJECT NAME=_PRINTUNE_ARM
  EXCLUDE_OBJECT RESET=1 NAME=_PRINTUNE_ARM
  # pauses between tests must not trip the idle timeout (it would turn the heaters off)
  SET_IDLE_TIMEOUT TIMEOUT=10800
  SET_PRESSURE_ADVANCE ADVANCE={pa}
  M221 S{params.EM|default(1)|float * 100}
  # a speed factor left over from a cancelled session (the bridge test uses M220)
  M220 S100
  RESPOND MSG="Printune: session started (PA {pa}, EM {params.EM|default(1)}). If you cancel, run _PRINTUNE_RESET."

[gcode_macro _PRINTUNE_APPLY]
description: Printune: apply the picked PA and EM
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  SET_PRESSURE_ADVANCE ADVANCE={S.pa}
  M221 S{S.em * 100}

[gcode_macro _PRINTUNE_PA_REL]
description: Printune: PA = picked value + D (fine pattern)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  SET_PRESSURE_ADVANCE ADVANCE={[S.pa + params.D|float, 0]|max}

[gcode_macro _PRINTUNE_EM_REL]
description: Printune: EM = picked value + D (fine cubes)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  M221 S{(S.em + params.D|float) * 100}

[gcode_macro _PRINTUNE_RET_SET]
description: Printune: retraction for the next tower ring (length is real mm, M221 is compensated)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set L = params.LEN|float %}
  {% set V = params.SPEED|default(30)|float %}
  {% set ef = printer.gcode_move.extrude_factor %}
  # a skipped tower still runs its macros: don't let it record a ring as tested
  {% if printer.exclude_object.current_object not in printer.exclude_object.excluded_objects %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=ret_len VALUE={L}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=ret_speed VALUE={V}
  {% endif %}
  {% if S.fw %}
    SET_RETRACTION RETRACT_LENGTH={L / ef} RETRACT_SPEED={V} UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED={V}
  {% endif %}
  M117 retraction {L} mm

[gcode_macro _PRINTUNE_RET_RESTORE]
description: Printune: firmware retraction back to the values from before the session
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if S.fw and 'firmware_retraction' in printer %}
    SET_RETRACTION RETRACT_LENGTH={S.r_len} RETRACT_SPEED={S.r_speed} UNRETRACT_EXTRA_LENGTH={S.r_extra} UNRETRACT_SPEED={S.r_uspeed}
  {% endif %}

[gcode_macro _PRINTUNE_R]
description: Printune: slicer-style retract during the tower test (no firmware retraction)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if S.ret_len > 0 %}
    G1 E-{S.ret_len / printer.gcode_move.extrude_factor} F{S.ret_speed * 60}
  {% endif %}

[gcode_macro _PRINTUNE_U]
description: Printune: slicer-style unretract during the tower test
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if S.ret_len > 0 %}
    G1 E{S.ret_len / printer.gcode_move.extrude_factor} F{S.ret_speed * 60}
  {% endif %}

[gcode_macro _PRINTUNE_TEMP]
description: Printune: set and wait for a tower temperature unless that tower was cancelled
gcode:
  {% if params.OBJ|upper not in printer.exclude_object.excluded_objects %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=ret_temp VALUE={params.S|int}
    M117 tower {params.S|int}C
    M109 S{params.S|int}
  {% endif %}

[gcode_macro _PRINTUNE_END]
description: Printune: put everything back (keeps the babystep so you can save it)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  SET_PRESSURE_ADVANCE ADVANCE={S.pa0}
  M221 S100
  M220 S100
  _PRINTUNE_SAVE KEY=printune_z_babystep VALUE={'%.4f' % (printer.gcode_move.homing_origin.z - S.z0)}
  _PRINTUNE_RET_RESTORE
  SET_IDLE_TIMEOUT TIMEOUT={S.idle0}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=active VALUE=0

[gcode_macro _PRINTUNE_RESET]
description: Printune: undo session settings after a cancelled session
gcode:
  {% if 'printune' in printer %}
    _PRINTUNE_ABORT
  {% endif %}
  {% if printer["gcode_macro _PRINTUNE"].active %}
    _PRINTUNE_END
  {% elif printer["gcode_macro _PRINTUNE"].keep_idle %}
    # cancelled during the heat soak
    SET_IDLE_TIMEOUT TIMEOUT={printer["gcode_macro _PRINTUNE"].idle0}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=keep_idle VALUE=0
    RESPOND MSG="Printune: heat soak cancelled, idle timeout restored."
  {% else %}
    M221 S100
    RESPOND MSG="Printune: no unfinished session found (after a restart the printer already uses its config values). Flow and speed set back to 100 %."
  {% endif %}
  # the bridge test's speed factor (M220): back to 100 % whatever state the session was in
  M220 S100
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=tested VALUE="''"
  RESPOND TYPE=command MSG="action:prompt_end"

#####################################################################
# Checkpoints and buttons
#####################################################################
[gcode_macro _PRINTUNE_CP]
description: Printune: pause and ask for the result of the test just printed
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set step = params.STEP|lower %}
  {% set obj = params.OBJ|default('')|upper %}
  {% set skip = params.SKIP|default('') %}
  {% set dz = printer.gcode_move.homing_origin.z - S.z0 %}
  {% set excl = printer.exclude_object.excluded_objects %}
  {% set objs = params.ALL|default('')|upper %}
  {% set skipped = (obj and obj in excl) or (objs and objs.split(',')|reject('in', excl)|list|length == 0) %}
  {% if skipped %}
    RESPOND MSG="Printune: {step} was skipped"
    {% if params.NEXT|default('') %}
      # another optional test follows: ask about it
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=more VALUE="'{params.NEXT|upper}'"
      _PRINTUNE_NEXT
      PAUSE
      SET_IDLE_TIMEOUT TIMEOUT=10800
    {% elif step in ['ret', 'cool_lt', 'mvs', 'bridge_flow'] %}
      _PRINTUNE_SUMMARY
    {% endif %}
  {% else %}
    {% if step == 'squish' or step == 'squish2' %}
      RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('squish', 'Printune')} - First layer squish"
      RESPOND TYPE=command MSG="action:prompt_text Look at the patches. Good squish: no gaps between lines, lines still clearly visible (not smooth or wavy). Babystep so far: {'%.3f' % dz} mm."
      RESPOND TYPE=command MSG="action:prompt_text Do not babystep while paused (RESUME restores the paused Z)."
      {% if step == 'squish' and skip %}
        RESPOND TYPE=command MSG="action:prompt_button Squish is good - go to pressure advance|_PRINTUNE_GO SKIP={skip}|primary"
        RESPOND TYPE=command MSG="action:prompt_button Print 4 more patches|_PRINTUNE_GO|secondary"
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_button Continue to pressure advance|_PRINTUNE_GO|primary"
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: paused. Type _PRINTUNE_GO to continue{(' or _PRINTUNE_GO SKIP=' ~ skip ~ ' to skip the extra patches') if skip else ''}."
      PAUSE
      # a PAUSE macro may set its own idle timeout; the pick can take a while
      SET_IDLE_TIMEOUT TIMEOUT=10800
    {% elif step == 'pa' or step == 'em' %}
      {% set vals = params.VALUES.split(',') %}
      {% if step == 'pa' %}
        RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('pa', 'Printune')} - Pressure advance"
        RESPOND TYPE=command MSG="action:prompt_text Pick the frame whose long edges look most even: no bulge or gap where the speed changes near the ends. If unsure, pick the higher value. The values are printed under the frames."
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('em', 'Printune')} - Extrusion multiplier"
        RESPOND TYPE=command MSG="action:prompt_text Judge the centre of each top surface: smoothest without ridges, no gaps or valleys. If unsure, pick the higher one. Labels are EM in %."
        RESPOND TYPE=command MSG="action:prompt_text Also check for pinholes where the top infill meets the walls."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for v in vals %}
        {% set lab = (v|float * 100)|round(1) if step == 'em' else v %}
        RESPOND TYPE=command MSG="action:prompt_button {lab}|_PRINTUNE_PICK STEP={step} VALUE={v}{(' SKIP=' ~ skip) if skip else ''}|primary"
        {% if loop.index % 4 == 0 and not loop.last %}
          RESPOND TYPE=command MSG="action:prompt_button_group_end"
          RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: paused. Type _PRINTUNE_PICK STEP={step} VALUE=<value>{(' SKIP=' ~ skip) if skip else ''}"
      PAUSE
      # a PAUSE macro may set its own idle timeout; the pick can take a while
      SET_IDLE_TIMEOUT TIMEOUT=10800
    {% elif step == 'pa_fine' or step == 'em_fine' %}
      {% set offs = params.OFFSETS.split(',') %}
      {% set base = S.pa if step == 'pa_fine' else S.em %}
      {% if step == 'pa_fine' %}
        RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('pa', 'Printune')} - Pressure advance, fine"
        RESPOND TYPE=command MSG="action:prompt_text Labels are offsets in 0.001 from your pick ({base}). Pick the frame with the most even edges."
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('em', 'Printune')} - Extrusion multiplier, fine"
        RESPOND TYPE=command MSG="action:prompt_text Labels are offsets in % from your pick ({'%.3f' % base}). Pick the smoothest top."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for o in offs if base + o|float > -0.00001 %}
        {% set v = [base + o|float, 0]|max %}
        {% set vs = ('%.4f' % v) %}
        {% set lab = (('%+.0f' % (o|float * 1000)) if step == 'pa_fine' else ('%+.1f' % (o|float * 100))) ~ ' = ' ~ (('%.3f' % v) if step == 'pa_fine' else ('%.3f' % v)) %}
        RESPOND TYPE=command MSG="action:prompt_button {lab}|_PRINTUNE_PICK STEP={step} VALUE={vs}|primary"
        {% if loop.index % 3 == 0 and not loop.last %}
          RESPOND TYPE=command MSG="action:prompt_button_group_end"
          RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: paused. Type _PRINTUNE_PICK STEP={step} VALUE=<value>"
      PAUSE
      # a PAUSE macro may set its own idle timeout; the pick can take a while
      SET_IDLE_TIMEOUT TIMEOUT=10800
    {% elif step == 'plate' and S.plate >= params.N|int %}
      # this plate was cleared already for an earlier test on it
    {% elif step == 'plate' %}
      # plate N counts as clear only after "Plate is clear" (_PRINTUNE_GO PLATE=N); a skip leaves it
      # uncleared, so the next test on this plate asks again
      RESPOND TYPE=command MSG="action:prompt_begin Printune - clear the plate"
      RESPOND TYPE=command MSG="action:prompt_text This bed is too small for every test at once. Take the test prints off the plate (keep them to compare later). Careful: the bed and nozzle are hot."
      RESPOND TYPE=command MSG="action:prompt_text The printer stays hot. Put the plate back the same way round."
      RESPOND TYPE=command MSG="action:prompt_button Plate is clear - continue|_PRINTUNE_GO PLATE={params.N|int}|primary"
      {% if skip %}
        {% set what = {'cool': 'the cooling test', 'cone': 'the layer-time cone', 'bridge': 'the bridge test', 'bridge_speed': 'the bridge speed and flow passes', 'bridge_flow': 'the bridge flow pass', 'mvs': 'the max flow tower'}[params.WHAT|default('mvs')|lower] %}
        RESPOND TYPE=command MSG="action:prompt_button Skip {what}|_PRINTUNE_GO SKIP={skip}|secondary"
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: paused. Clear the plate, then type _PRINTUNE_GO PLATE={params.N|int}."
      PAUSE
      # a PAUSE macro may set its own idle timeout; clearing the plate can take a while
      SET_IDLE_TIMEOUT TIMEOUT=10800
    {% elif step == 'ret_ask' %}
      RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('ret', 'Printune')} - Retraction towers?"
      RESPOND TYPE=command MSG="action:prompt_text Retraction tuning is often unnecessary (direct drive: 0.5 mm at 35 mm/s is a good start). Print the towers only if you see stringing."
      RESPOND TYPE=command MSG="action:prompt_text Before printing them: brush the nozzle clean. Towers print one at a time, hottest first."
      RESPOND TYPE=command MSG="action:prompt_button Print the retraction towers|_PRINTUNE_GO|primary"
      RESPOND TYPE=command MSG="action:prompt_button Skip them|_PRINTUNE_GO SKIP={skip}|secondary"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: paused. Type _PRINTUNE_GO (towers) or _PRINTUNE_GO SKIP={skip} (skip them)."
      PAUSE
      # a PAUSE macro may set its own idle timeout; the pick can take a while
      SET_IDLE_TIMEOUT TIMEOUT=10800
    {% elif step == 'ret' %}
      {% set temps = params.TEMPS.split(',') %}
      RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('ret', 'Printune')} - Retraction"
      RESPOND TYPE=command MSG="action:prompt_text Pick the tower (temperature) with the least stringing. If the hotter towers are much stringier, pick a cooler one."
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for t in temps %}
        RESPOND TYPE=command MSG="action:prompt_button {t} C|_PRINTUNE_PICK STEP=ret_temp VALUE={t} RINGS={params.RINGS}|primary"
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: type _PRINTUNE_PICK STEP=ret_temp VALUE=<temp> RINGS={params.RINGS}"
      {% if params.NEXT|default('') %}
        # another test (objects NEXT) follows: pick now, it prints at the picked temperature
        SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=more VALUE="'{params.NEXT|upper}'"
        PAUSE
        SET_IDLE_TIMEOUT TIMEOUT=10800
      {% endif %}
    {% elif step == 'cool_fan' %}
      RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('cool', 'Printune')} - Cooling: fan"
      RESPOND TYPE=command MSG="action:prompt_text Each block is labelled with its fan %. From the bottom up its front leans out {params.ANGLES.replace(',', ', ')} degrees, with a groove on the sides at each step."
      RESPOND TYPE=command MSG="action:prompt_text Pick the lowest fan whose overhangs look good up to the angle you need. It becomes the fan for the whole print: a steady fan avoids banding."
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for f in params.FANS.split(',') %}
        RESPOND TYPE=command MSG="action:prompt_button {f} %|_PRINTUNE_PICK STEP=cool_fan VALUE={f}|primary"
        {% if loop.index % 4 == 0 and not loop.last %}
          RESPOND TYPE=command MSG="action:prompt_button_group_end"
          RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: paused. Type _PRINTUNE_PICK STEP=cool_fan VALUE=<fan %>"
      PAUSE
      SET_IDLE_TIMEOUT TIMEOUT=10800
    {% elif step == 'cool_lt' %}
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_times VALUE="'{params.TIMES}'"
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_top VALUE={params.TOP|default(1)|float}
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_fan0 VALUE={params.FAN|default(0)|int}
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_type VALUE="'{params.TYPE|default('')|upper}'"
      _PRINTUNE_COOL_UI
      {% if params.NEXT|default('') %}
        # another test (objects NEXT) follows: pick now
        SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=more VALUE="'{params.NEXT|upper}'"
        PAUSE
        SET_IDLE_TIMEOUT TIMEOUT=10800
      {% endif %}
    {% elif step in ['bridge_fan', 'bridge_speed', 'bridge_flow'] %}
      {% set t = S.titles.get('bridge', 'Printune') %}
      {% set fan = S.br_fan if S.br_fan >= 0 else S.br_base %}
      {% if step == 'bridge_fan' %}
        {% set per = S.br_fans.split(',') %}
        {% set vals = [] %}
        {% for v in per %}{% if v not in vals %}{% set _ = vals.append(v) %}{% endif %}{% endfor %}
        RESPOND TYPE=command MSG="action:prompt_begin {t} - Bridges: fan"
        RESPOND TYPE=command MSG="action:prompt_text Each strip bridges {params.SPANS.replace(',', ', ')} mm, left to right. Strip 1 is at the front; each printed its bridges at its own fan."
      {% elif step == 'bridge_speed' %}
        {% set vals = params.SPEEDS.split(',') %}
        RESPOND TYPE=command MSG="action:prompt_begin {t} - Bridges: speed"
        RESPOND TYPE=command MSG="action:prompt_text All at {fan} % fan. Each strip is labelled with its bridge speed in mm/s."
      {% else %}
        {% set vals = params.FLOWS.split(',') %}
        RESPOND TYPE=command MSG="action:prompt_begin {t} - Bridges: flow"
        RESPOND TYPE=command MSG="action:prompt_text All at {fan} % fan{(' and %g mm/s' % S.br_speed) if S.br_speed > 0 else ''}. Each strip is labelled with its bridge flow in %. Less flow sags less, but the strands get thin."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_text Look from below. Pick the strip with the least sag and the cleanest, straightest strands."
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for v in vals %}
        {% if step == 'bridge_fan' %}
          {% set ix = [] %}
          {% for p in per %}{% if p == v %}{% set _ = ix.append(loop.index) %}{% endif %}{% endfor %}
          {% set lab = ('%d: %s %%' % (ix[0], v)) if ix|length == 1 else ('%d-%d: %s %%' % (ix[0], ix[-1], v)) %}
        {% else %}
          {% set lab = ('%s mm/s' % v) if step == 'bridge_speed' else ('%g = %s' % (v|float * 100, v)) %}
        {% endif %}
        RESPOND TYPE=command MSG="action:prompt_button {lab}|_PRINTUNE_PICK STEP={step} VALUE={v}|primary"
        {% if loop.index % 4 == 0 and not loop.last %}
          RESPOND TYPE=command MSG="action:prompt_button_group_end"
          RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="Printune: type _PRINTUNE_PICK STEP={step} VALUE=<value>"
      {% if step != 'bridge_flow' %}
        PAUSE
        SET_IDLE_TIMEOUT TIMEOUT=10800
      {% elif params.NEXT|default('') %}
        # another test (objects NEXT) follows: pick now
        SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=more VALUE="'{params.NEXT|upper}'"
        PAUSE
        SET_IDLE_TIMEOUT TIMEOUT=10800
      {% endif %}
    {% elif step == 'mvs' %}
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=mvs_flows VALUE="'{params.FLOWS}'"
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=mvs_base VALUE={params.BASE|float}
      SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=mvs_band VALUE={params.BAND|float}
      _PRINTUNE_MVS_UI
      {% if params.NEXT|default('') %}
        # another test (objects NEXT) follows: pick now
        SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=more VALUE="'{params.NEXT|upper}'"
        PAUSE
        SET_IDLE_TIMEOUT TIMEOUT=10800
      {% endif %}
    {% else %}
      _PRINTUNE_SUMMARY
    {% endif %}
  {% endif %}

[gcode_macro _PRINTUNE_PICK]
description: Printune: record a picked value (prompt buttons call this)
gcode:
  {% set step = params.STEP|lower %}
  {% set v = params.VALUE|float %}
  {% set skip = params.SKIP|default('') %}
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set kind = 'pa' if step in ['pa', 'pa_fine'] else ('em' if step in ['em', 'em_fine'] else ('cool' if step in ['cool_fan', 'cool_lt'] else ('bridge' if step.startswith('bridge_') else (step if step in ['ret', 'mvs'] else '')))) %}
  {% if kind and kind not in S.tested.split(',') %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=tested VALUE="'{(S.tested ~ ',' ~ kind).strip(',')}'"
  {% endif %}
  {% if step in ['pa', 'pa_fine'] %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=pa VALUE={v}
    _PRINTUNE_SAVE KEY=printune_pa VALUE={v}
  {% elif step in ['em', 'em_fine'] %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=em VALUE={v}
    _PRINTUNE_SAVE KEY=printune_em VALUE={v}
  {% elif step == 'ret_temp' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=ret_temp VALUE={v|int}
    _PRINTUNE_SAVE KEY=printune_ret_temp VALUE={v|int}
  {% elif step == 'ret' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=ret_len VALUE={v}
    _PRINTUNE_SAVE KEY=printune_ret_len VALUE={v}
    _PRINTUNE_SAVE KEY=printune_ret_speed VALUE={S.ret_speed}
  {% elif step == 'mvs' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=mvs VALUE={v}
    _PRINTUNE_SAVE KEY=printune_max_flow VALUE={v}
  {% elif step == 'cool_fan' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_fan VALUE={v|int}
    _PRINTUNE_SAVE KEY=printune_fan VALUE={v|int}
  {% elif step == 'cool_lt' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=cool_lt VALUE={v}
    _PRINTUNE_SAVE KEY=printune_min_layer_time VALUE={v}
  {% elif step == 'bridge_fan' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_fan VALUE={v|int}
    _PRINTUNE_SAVE KEY=printune_bridge_fan VALUE={v|int}
  {% elif step == 'bridge_speed' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_speed VALUE={v}
    _PRINTUNE_SAVE KEY=printune_bridge_speed VALUE={v}
  {% elif step == 'bridge_flow' %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_flow VALUE={v}
    _PRINTUNE_SAVE KEY=printune_bridge_flow VALUE={v}
  {% endif %}
  RESPOND MSG="Printune: {step} = {params.VALUE}"
  {% if step in ['pa', 'em'] and skip %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin Printune - fine pass?"
    {% if step == 'pa' %}
      RESPOND TYPE=command MSG="action:prompt_text Picked PA {params.VALUE}. A fine pass re-runs the pattern in 0.001 steps around the pick. Optional."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Picked EM {'%.3f' % v}. A fine pass re-runs the cubes in 0.5 % steps around the pick. Optional."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Print the fine pass|_PRINTUNE_GO|primary"
    RESPOND TYPE=command MSG="action:prompt_button Skip it, keep {params.VALUE}|_PRINTUNE_GO SKIP={skip}|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
    RESPOND MSG="Printune: type _PRINTUNE_GO (fine pass) or _PRINTUNE_GO SKIP={skip} (skip it)"
  {% elif step == 'ret_temp' %}
    {% set rings = params.RINGS.split(',') %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('ret', 'Printune')} - Retraction length ({v|int} C)"
    RESPOND TYPE=command MSG="action:prompt_text Count the rings from the bottom (ring 1 = no retraction). Pick 1-2 rings above where the stringing stops."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for r in rings %}
      RESPOND TYPE=command MSG="action:prompt_button {loop.index}: {r} mm|_PRINTUNE_PICK STEP=ret VALUE={r}|primary"
      {% if loop.index % 4 == 0 and not loop.last %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"
    RESPOND MSG="Printune: type _PRINTUNE_PICK STEP=ret VALUE=<mm>"
  {% elif step in ['ret', 'cool_lt', 'cool_skip', 'bridge_flow', 'mvs', 'mvs_skip'] and S.more %}
    # another test follows (the session is paused): ask about it
    _PRINTUNE_NEXT
  {% elif step in ['ret', 'cool_lt', 'cool_skip', 'bridge_flow', 'mvs', 'mvs_skip'] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _PRINTUNE_SUMMARY
  {% else %}
    _PRINTUNE_GO
  {% endif %}

[gcode_macro _PRINTUNE_GO]
description: Printune: continue the session; SKIP=obj1,obj2 cancels optional parts first
gcode:
  {% if params.PLATE %}
    SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=plate VALUE={params.PLATE|int}
  {% endif %}
  {% for o in (params.SKIP|default('')).upper().split(',') %}
    {% if o %}
      EXCLUDE_OBJECT NAME={o}
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer.pause_resume.is_paused %}
    RESUME
  {% endif %}

[gcode_macro _PRINTUNE_SUMMARY]
description: Printune: show the picked values and where to save them
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set dz = printer.gcode_move.homing_origin.z - S.z0 %}
  {% set tested = S.ret_temp > 0 %}
  {% set rline = ("retraction %.2f mm @ %.0f mm/s | tower temp %d C" % (S.ret_len, S.ret_speed, S.ret_temp)) if tested else "retraction not tested (keep yours)" %}
  {% set tl = S.tested.split(',') %}
  {% set only_mvs = S.tested != '' and tl|reject('in', ['cool', 'bridge', 'mvs'])|list|length == 0 %}
  {% set extra = [] %}
  {% if 'cool' in tl and S.cool_fan >= 0 %}{% set _ = extra.append("fan %d %% constant" % S.cool_fan) %}{% endif %}
  {% if 'cool' in tl and S.cool_lt > 0 %}{% set _ = extra.append("min layer time %g s" % S.cool_lt) %}{% endif %}
  {% if 'bridge' in tl and S.br_fan >= 0 %}{% set _ = extra.append("bridge fan %d %%" % S.br_fan) %}{% endif %}
  {% if 'bridge' in tl and S.br_speed > 0 %}{% set _ = extra.append("bridge speed %g mm/s" % S.br_speed) %}{% endif %}
  {% if 'bridge' in tl and S.br_flow > 0 %}{% set _ = extra.append("bridge flow %g" % S.br_flow) %}{% endif %}
  {% if 'mvs' in tl %}{% set _ = extra.append("max flow %.1f mm3/s" % S.mvs) %}{% endif %}
  {% set mline = extra|join(' | ') %}
  {% set line = mline if only_mvs else ("PA %.4f | EM %.3f (Orca flow ratio %.3f) | %s | babystep %+.3f mm" % (S.pa, S.em, S.em / (S.pfr or 1.0), rline, dz)) ~ ((" | " ~ mline) if mline else "") %}
  RESPOND MSG="Printune results: {line}"
  {% set exp = 'printune' in printer and S.tested %}
  {% if exp %}
    _PRINTUNE_EXPORT SOFT=1
  {% endif %}
  {% if not params.QUIET|default(0)|int %}
    _PRINTUNE_SUMMARY_PROMPT EXPORT={1 if exp else 0}
  {% endif %}

[gcode_macro _PRINTUNE_SUMMARY_PROMPT]
description: Printune: the results prompt (runs after _PRINTUNE_EXPORT so it can name the file)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set dz = printer.gcode_move.homing_origin.z - S.z0 %}
  {% set tested = S.ret_temp > 0 %}
  {% set rline = ("retraction %.2f mm @ %.0f mm/s | tower temp %d C" % (S.ret_len, S.ret_speed, S.ret_temp)) if tested else "retraction not tested (keep yours)" %}
  {% set tl = S.tested.split(',') %}
  {% set only_mvs = S.tested != '' and tl|reject('in', ['cool', 'bridge', 'mvs'])|list|length == 0 %}
  {% set extra = [] %}
  {% if 'cool' in tl and S.cool_fan >= 0 %}{% set _ = extra.append("fan %d %% constant" % S.cool_fan) %}{% endif %}
  {% if 'cool' in tl and S.cool_lt > 0 %}{% set _ = extra.append("min layer time %g s" % S.cool_lt) %}{% endif %}
  {% if 'bridge' in tl and S.br_fan >= 0 %}{% set _ = extra.append("bridge fan %d %%" % S.br_fan) %}{% endif %}
  {% if 'bridge' in tl and S.br_speed > 0 %}{% set _ = extra.append("bridge speed %g mm/s" % S.br_speed) %}{% endif %}
  {% if 'bridge' in tl and S.br_flow > 0 %}{% set _ = extra.append("bridge flow %g" % S.br_flow) %}{% endif %}
  {% if 'mvs' in tl %}{% set _ = extra.append("max flow %.1f mm3/s" % S.mvs) %}{% endif %}
  {% set mline = extra|join(' | ') %}
  {% set line = mline if only_mvs else ("PA %.4f | EM %.3f (Orca flow ratio %.3f) | %s | babystep %+.3f mm" % (S.pa, S.em, S.em / (S.pfr or 1.0), rline, dz)) ~ ((" | " ~ mline) if mline else "") %}
  RESPOND TYPE=command MSG="action:prompt_begin Printune results"
  RESPOND TYPE=command MSG="action:prompt_text {line}"
  {% set pt = printer.printune if 'printune' in printer else {} %}
  {% if params.EXPORT|int and (pt.last_name or pt.last_proc_name) %}
    {% if pt.last_name %}
      RESPOND TYPE=command MSG="action:prompt_text Orca filament preset written: {pt.last_rel}. Download it in Mainsail (Machine tab) and import it in Orca with File > Import > Import Configs. The printer's own values are back now."
    {% endif %}
    {% if pt.last_proc_name %}
      RESPOND TYPE=command MSG="action:prompt_text Orca process preset (bridge speed and flow) written: {pt.last_proc_rel}. Import it the same way; it shows up under the process presets as {pt.last_proc_name}."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Or type them in Orca yourself:"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text Put these in Orca (the printer's own values are back now). Filament values go in this filament's profile{', Process values in your process (print) profile' if S.br_speed > 0 or S.br_flow > 0 else ''}:"
  {% endif %}
  {% if not only_mvs %}
  RESPOND TYPE=command MSG="action:prompt_text Filament > Flow ratio: {'%.3f' % (S.em / (S.pfr or 1.0))}. Filament > Pressure advance: tick Enable, {'%.4f' % S.pa}."
  {% endif %}
  {% if tested %}
    {% if S.fw %}
      RESPOND TYPE=command MSG="action:prompt_text Retraction (firmware retraction is global, so set it per filament): Advanced > Filament start G-code: SET_RETRACTION RETRACT_LENGTH={'%.2f' % S.ret_len} RETRACT_SPEED={'%.0f' % S.ret_speed} UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED={'%.0f' % S.ret_speed}  (give every filament profile its own line)."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Setting overrides > Retraction length {'%.2f' % S.ret_len}, Retraction and Deretraction speed {'%.0f' % S.ret_speed}."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Filament > Nozzle temperature: {S.ret_temp} C, if that tower was clearly cleaner than the others."
  {% endif %}
  {% if 'cool' in tl and S.cool_fan >= 0 %}
    RESPOND TYPE=command MSG="action:prompt_text Filament > Cooling: Fan speed {S.cool_fan} % for both Min and Max fan speed threshold, tick Keep fan always on{'' if S.br_fan >= 0 else ', Overhangs and external bridges fan speed %d %%' % S.cool_fan|int}."
  {% endif %}
  {% if 'cool' in tl and S.cool_lt > 0 %}
    RESPOND TYPE=command MSG="action:prompt_text Filament > Cooling > Max fan speed threshold: Layer time {'%g' % S.cool_lt} s, and tick Slow printing down for better layer cooling."
  {% endif %}
  {% if 'bridge' in tl and S.br_fan >= 0 %}
    RESPOND TYPE=command MSG="action:prompt_text Filament > Cooling > Overhangs and external bridges fan speed: {S.br_fan} %, with Force cooling for overhangs and bridges ticked (the exported preset ticks it). Bridges and overhang walls run at this fan. Keep Overhang cooling activation threshold above 0 %: at 0 % every outer wall runs at the bridge fan (the exported preset sets 95 % then)."
  {% endif %}
  {% if 'bridge' in tl and S.br_speed > 0 %}
    RESPOND TYPE=command MSG="action:prompt_text Process > Speed > Bridge > External: {'%g' % S.br_speed} mm/s."
  {% endif %}
  {% if 'bridge' in tl and S.br_flow > 0 %}
    RESPOND TYPE=command MSG="action:prompt_text Process > Quality > Bridge flow ratio: {'%g' % S.br_flow}."
  {% endif %}
  {% if 'mvs' in tl %}
    RESPOND TYPE=command MSG="action:prompt_text Filament > Max volumetric speed: {'%.1f' % S.mvs} mm3/s (= {'%.0f' % (S.mvs / 0.081416)} mm/s at a 0.2 mm layer and 0.45 mm line)."
  {% endif %}
  {% if not only_mvs %}
  RESPOND TYPE=command MSG="action:prompt_text Squish: if your start macro does not set its own Z offset, Z_OFFSET_APPLY_PROBE then SAVE_CONFIG stores the babystep. Check how your probe setup stores it first."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

#####################################################################
# Hands-on tests (extruder calibration and max volumetric flow)
#####################################################################
[gcode_macro _PRINTUNE_EXTRUDE_TEST]
description: Printune: extruder calibration - mark the filament 120 mm above the extruder first
gcode:
  {% set L = params.LENGTH|default(100)|float %}
  {% set V = params.SPEED|default(1)|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set c = printer.configfile.settings[ex] %}
  {% if c.max_extrude_only_distance < L + 1 %}
    {action_raise_error("Printune: set max_extrude_only_distance: %d in [%s] and RESTART" % (L + 1, ex))}
  {% endif %}
  {% if printer[ex].temperature < c.min_extrude_temp %}
    {action_raise_error("Printune: heat the hotend first (or set min_extrude_temp: 0 for a cold test)")}
  {% endif %}
  SAVE_GCODE_STATE NAME=_printune_ext
  M221 S100
  M83
  G1 E{L} F{V * 60}
  M400
  RESTORE_GCODE_STATE NAME=_printune_ext
  RESPOND MSG="Printune: extruded {L} mm at {V} mm/s. Measure what is left of the 120 mm mark, then _PRINTUNE_EXTRUDE_RESULT LEFT=<mm>"

[gcode_macro _PRINTUNE_EXTRUDE_RESULT]
description: Printune: new rotation_distance from the length left of the 120 mm mark
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set ex = printer.toolhead.extruder %}
  {% set rd = S.rd if S.rd > 0 else printer.configfile.settings[ex].rotation_distance %}
  {% set actual = 120 - params.LEFT|float %}
  {% set new = rd * actual / params.LENGTH|default(100)|float %}
  SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER={ex} DISTANCE={new}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=rd VALUE={new}
  _PRINTUNE_SAVE KEY=printune_rotation_distance VALUE={'%.5f' % new}
  RESPOND MSG="Printune: extruded {actual} mm -> rotation_distance {rd} -> {'%.5f' % new} (active until the next restart). Repeat the test until it lands on 100 mm, then put it in [{ex}] rotation_distance in printer.cfg (it is the same for every filament) and RESTART."

[gcode_macro _PRINTUNE_FLOW_TEST]
description: Printune: max volumetric flow - extrude 100 mm at FLOW mm3/s, then check 100 mm went in
gcode:
  {% set F = params.FLOW|default(10)|float %}
  {% set L = params.LENGTH|default(100)|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set c = printer.configfile.settings[ex] %}
  {% set area = 3.14159265 * (c.filament_diameter / 2) ** 2 %}
  {% set v = F / area %}
  {% if c.max_extrude_only_distance < L + 1 %}
    {action_raise_error("Printune: set max_extrude_only_distance: %d in [%s] and RESTART" % (L + 1, ex))}
  {% endif %}
  {% if v > c.max_extrude_only_velocity %}
    {action_raise_error("Printune: %.1f mm/s is above max_extrude_only_velocity (%.1f)" % (v, c.max_extrude_only_velocity))}
  {% endif %}
  {% if printer[ex].temperature < c.min_extrude_temp %}
    {action_raise_error("Printune: heat the hotend first")}
  {% endif %}
  SAVE_GCODE_STATE NAME=_printune_flow
  M221 S100
  M83
  G1 E{L} F{v * 60}
  M400
  RESTORE_GCODE_STATE NAME=_printune_flow
  RESPOND MSG="Printune: {L} mm at {'%.2f' % v} mm/s = {F} mm3/s. Keep raising FLOW until less than 100 mm goes in (a 2-3 % drop-off is the limit), then set a slightly lower value as Orca 'Max volumetric speed'."

#####################################################################
# Max volumetric flow tower: where did the wall get rough?
#####################################################################
[gcode_macro _PRINTUNE_MVS_TEMP]
description: Printune: max flow tower at the picked tower temperature (else S) unless it was cancelled
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if params.OBJ|upper not in printer.exclude_object.excluded_objects %}
    {% set t = S.ret_temp if S.ret_temp > 0 else params.S|int %}
    M117 {S.titles.get('mvs', 'Printune')} max flow {t}C
    M109 S{t}
  {% endif %}

[gcode_macro _PRINTUNE_SAVEPOINT]
description: Printune: write the picks so far as the Orca preset (before a long test, so a cancel keeps them)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if 'printune' in printer and S.tested %}
    _PRINTUNE_EXPORT SOFT=1
  {% endif %}

[gcode_macro _PRINTUNE_NEXT]
description: Printune: ask whether to print the next optional test (its objects are in _PRINTUNE.more)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set nxt = S.more %}
  {% set at = (' It prints at %d C.' % S.ret_temp) if S.ret_temp > 0 else '' %}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=more VALUE="''"
  RESPOND TYPE=command MSG="action:prompt_end"
  # the picks so far go into the preset now: a cancel during the next test keeps them
  _PRINTUNE_SAVEPOINT
  {% if nxt.startswith('COOL') %}
    RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('cool', 'Printune')} - Cooling test?"
    RESPOND TYPE=command MSG="action:prompt_text {'Your picks so far are in the Orca preset already. ' if S.tested else ''}Next: overhang blocks at a few fan speeds, then a cone that shows the shortest layer time this filament takes.{at}"
    RESPOND TYPE=command MSG="action:prompt_button Print the cooling test|_PRINTUNE_GO|primary"
    RESPOND TYPE=command MSG="action:prompt_button Skip it|_PRINTUNE_GO SKIP={nxt}|secondary"
  {% elif nxt.startswith('BR_') %}
    RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('bridge', 'Printune')} - Bridge test?"
    RESPOND TYPE=command MSG="action:prompt_text {'Your picks so far are in the Orca preset already. ' if S.tested else ''}Next: short bridges in three passes, with a pick after each: fan, then speed, then flow.{at}"
    RESPOND TYPE=command MSG="action:prompt_button Print the bridge test|_PRINTUNE_GO|primary"
    RESPOND TYPE=command MSG="action:prompt_button Skip it|_PRINTUNE_GO SKIP={nxt}|secondary"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('mvs', 'Printune')} - Max flow tower?"
    RESPOND TYPE=command MSG="action:prompt_text {'Your picks so far are in the Orca preset already. ' if S.tested else ''}Next: a tall tower that shows how fast this filament can melt.{at}"
    RESPOND TYPE=command MSG="action:prompt_button Print the max flow tower|_PRINTUNE_GO|primary"
    RESPOND TYPE=command MSG="action:prompt_button Skip it|_PRINTUNE_GO SKIP={nxt}|secondary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_show"
  RESPOND MSG="Printune: type _PRINTUNE_GO (print it) or _PRINTUNE_GO SKIP={nxt} (skip it)"

#####################################################################
# Cooling: a constant fan from the overhang blocks, the minimum layer time from the cone
#####################################################################
[gcode_macro _PRINTUNE_COOL_TEMP]
description: Printune: cooling test at the picked tower temperature (else S) unless it was cancelled
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if params.OBJ|upper not in printer.exclude_object.excluded_objects %}
    {% set t = S.ret_temp if S.ret_temp > 0 else params.S|int %}
    M117 {S.titles.get('cool', 'Printune')} cooling {t}C
    M109 S{t}
  {% endif %}

[gcode_macro _PRINTUNE_COOL_FAN]
description: Printune: the cone's fan: the picked fan % (else D %)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set f = S.cool_fan if S.cool_fan >= 0 else params.D|default(100)|int %}
  M106 S{(f * 2.55)|round|int}

[gcode_macro _PRINTUNE_COOL_UI]
description: Printune: cooling cone, pick the marker where it starts to melt
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set times = S.cool_times.split(',') if S.cool_times else [] %}
  {% set fan = S.cool_fan if S.cool_fan >= 0 else S.cool_fan0 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('cool', 'Printune')} - Cooling: layer time"
  {% if not times %}
    RESPOND TYPE=command MSG="action:prompt_text No cooling cone in this session."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text The cone printed at {fan} % fan; every layer is quicker than the one below. Bumps on the front mark the layer time: {times[0]} s at the lowest bump, then 2 s less at each one up to {times[-1]} s."
    RESPOND TYPE=command MSG="action:prompt_text Tap the bump where the cone starts to melt, sag or curl. Curling at low fan can also be a bed adhesion problem."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for t in times|reverse %}
      RESPOND TYPE=command MSG="action:prompt_button {t} s|_PRINTUNE_COOL_AT T={t}|primary"
      {% if loop.index % 4 == 0 and not loop.last %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_button Fine to the top|_PRINTUNE_COOL_AT T={'%.1f' % S.cool_top} TOP=1|secondary"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Skip, keep yours|_PRINTUNE_PICK STEP=cool_skip VALUE=0|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PRINTUNE_COOL_AT]
description: Printune: minimum layer time from the cone's marker T (s) plus a 3 s margin (USE= to adjust)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set T = params.T|float %}
  {% set top = params.TOP|default(0)|int %}
  {% set use = [params.USE|default(T + 3)|float, 1]|max|round|int %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('cool', 'Printune')} - Cooling: {use} s"
  RESPOND TYPE=command MSG="action:prompt_text {('Fine to the top (%g s).' % T) if top else ('It starts to melt at the %g s bump.' % T)} Use {use} s as minimum layer time: {'%g' % T} s {'+' if use >= T else '-'} {'%g' % (use - T)|abs} s margin. Orca slows down layers that would print quicker."
  {% if S.cool_type in ['ABS', 'ASA'] and (use < 10 or use > 20) %}
    RESPOND TYPE=command MSG="action:prompt_text {S.cool_type} usually needs about 15 s. {use} s is far from that: check the cone again, and that the chamber was warm."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for d in [-1, 1] %}
    RESPOND TYPE=command MSG="action:prompt_button {'%+d' % d} s|_PRINTUNE_COOL_AT T={params.T} TOP={top} USE={[use + d, 1]|max}|secondary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Use {use} s|_PRINTUNE_PICK STEP=cool_lt VALUE={use}|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_PRINTUNE_COOL_UI|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"
  RESPOND MSG="Printune: minimum layer time {use} s. _PRINTUNE_PICK STEP=cool_lt VALUE={use}"

#####################################################################
# Bridges: fan, then speed, then flow (Orca's external bridge settings)
#####################################################################
[gcode_macro _PRINTUNE_BRIDGE_TEMP]
description: Printune: bridge pass at the picked tower temperature (else S) unless it was cancelled
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if params.OBJ|upper not in printer.exclude_object.excluded_objects %}
    {% set t = S.ret_temp if S.ret_temp > 0 else params.S|int %}
    M117 {S.titles.get('bridge', 'Printune')} bridges {t}C
    M109 S{t}
  {% endif %}

[gcode_macro _PRINTUNE_BRIDGE_FANS]
description: Printune: the fan pass's fans, from the picked cooling fan (else BASE) up to 100 % (or FANS=)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set n = params.N|default(4)|int %}
  {% set base = S.cool_fan if S.cool_fan >= 0 else params.BASE|default(0)|int %}
  {% set raw = [] %}
  {% if params.FANS|default('') %}
    {% for f in params.FANS.split(',') %}{% set _ = raw.append(f|int) %}{% endfor %}
  {% else %}
    # Orca uses the bridge fan only when it is above the normal fan, so start at the normal fan
    # (steps of 5 %, never below the normal fan)
    {% for i in range(n) %}
      {% set _ = raw.append(base if i == 0 else [[(((base + (100 - base) * i / (n - 1)) / 5)|round|int) * 5, base]|max, 100]|min) %}
    {% endfor %}
  {% endif %}
  # each fan once (near 100 % the 5 % steps meet); strips past the last distinct fan repeat it
  {% set fans = [] %}
  {% for f in raw %}{% if f not in fans %}{% set _ = fans.append(f) %}{% endif %}{% endfor %}
  {% set strips = [] %}
  {% for i in range(n) %}{% set _ = strips.append(fans[[i, fans|length - 1]|min]) %}{% endfor %}
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_fans VALUE="'{strips|join(',')}'"
  SET_GCODE_VARIABLE MACRO=_PRINTUNE VARIABLE=br_base VALUE={base}
  {% if fans|length < 2 and params.OBJ|upper not in printer.exclude_object.excluded_objects %}
    {% if not params.FANS|default('') and base >= 100 %}
      RESPOND MSG="Printune: the fan is at 100 % already, so the bridges print at 100 %: no fan pass."
    {% else %}
      RESPOND MSG="Printune: only one fan to compare ({fans[0]} %): no fan pass."
    {% endif %}
    EXCLUDE_OBJECT NAME={params.OBJ|upper}
  {% endif %}

[gcode_macro _PRINTUNE_BRIDGE_FAN]
description: Printune: fan for a strip's bridges: fan pass strip I, else the picked bridge fan (else the base)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% if params.I is defined %}
    {% set f = S.br_fans.split(',')[params.I|int - 1]|int %}
  {% else %}
    {% set f = S.br_fan if S.br_fan >= 0 else S.br_base %}
  {% endif %}
  M106 S{(f * 2.55)|round|int}

[gcode_macro _PRINTUNE_BRIDGE_SPEED]
description: Printune: bridge lines written at REF mm/s print at the picked bridge speed (M220)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set ref = params.REF|float %}
  {% set v = S.br_speed if S.br_speed > 0 else ref %}
  M220 S{'%.2f' % (100 * v / ref)}

[gcode_macro _PRINTUNE_MVS_UI]
description: Printune: max flow tower, pick the band where the wall first gets rough
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set flows = S.mvs_flows.split(',') if S.mvs_flows else [] %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('mvs', 'Printune')} - Max flow"
  {% if not flows %}
    RESPOND TYPE=command MSG="action:prompt_text No max flow tower in this session."
  {% else %}
    {% set marks = [] %}
    {% for f in flows %}
      {% if not loop.first and (f|float / 5 + 0.000001)|int > (flows[loop.index0 - 1]|float / 5 + 0.000001)|int %}
        {% set _ = marks.append('%.1f mm = %s' % (S.mvs_base + loop.index0 * S.mvs_band, f)) %}
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_text Find where the wall first gets rough, gappy or weak. Measure that height from the bed, or count the bands: band 1 starts at {'%.2f' % S.mvs_base} mm, each band is {'%.1f' % S.mvs_band} mm and 1 step higher."
    {% if marks %}
      RESPOND TYPE=command MSG="action:prompt_text The bumps on the front mark these heights and flows (mm3/s): {marks|join(', ')}."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Tap the band (flow in mm3/s), or type _PRINTUNE_MVS_AT HEIGHT=<mm>. If the whole tower is fine, tap the top band."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for f in flows %}
      RESPOND TYPE=command MSG="action:prompt_button {loop.index}: {f}|_PRINTUNE_MVS_AT BAND={loop.index}|primary"
      {% if loop.index % 5 == 0 and not loop.last %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Skip, keep yours|_PRINTUNE_PICK STEP=mvs_skip VALUE=0|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _PRINTUNE_MVS_AT]
description: Printune: the flow at a height (HEIGHT=mm) or band (BAND=n) of the tower and about 90 % of it to use (USE= to adjust)
gcode:
  {% set S = printer["gcode_macro _PRINTUNE"] %}
  {% set flows = S.mvs_flows.split(',') if S.mvs_flows else [] %}
  {% if not flows %}
    {action_raise_error("Printune: no max flow tower printed since the last restart")}
  {% endif %}
  {% set n = flows|length %}
  {% if params.HEIGHT is defined %}
    {% set b = ((params.HEIGHT|float - S.mvs_base) / S.mvs_band + 1000)|int - 999 %}
  {% else %}
    {% set b = params.BAND|default(1)|int %}
  {% endif %}
  {% set b = [[b, 1]|max, n]|min %}
  {% set f = flows[b - 1]|float %}
  # never more than the band printed: above it is untested
  {% set use = [[params.USE|default(f * 0.9)|float, 0.5]|max, f]|min %}
  {% set use = (use * 10)|round / 10 %}
  # 0.2 mm layer, 0.45 mm line: (0.45 - 0.2) * 0.2 + pi * 0.1^2 = 0.081416 mm2
  {% set mms = use / 0.081416 %}
  RESPOND TYPE=command MSG="action:prompt_end"
  RESPOND TYPE=command MSG="action:prompt_begin {S.titles.get('mvs', 'Printune')} - Max flow: band {b}"
  RESPOND TYPE=command MSG="action:prompt_text Band {b} ({'%.2f' % (S.mvs_base + (b - 1) * S.mvs_band)}-{'%.2f' % (S.mvs_base + b * S.mvs_band)} mm) printed at {'%g' % f} mm3/s."
  RESPOND TYPE=command MSG="action:prompt_text Use {'%.1f' % use} mm3/s ({'%.0f' % (100 * use / f)} % of it, for a margin). That is {'%.0f' % mms} mm/s at a 0.2 mm layer and 0.45 mm line."
  RESPOND TYPE=command MSG="action:prompt_button_group_start"
  {% for d in [-1, -0.5, 0.5, 1] %}
    RESPOND TYPE=command MSG="action:prompt_button {'%+g' % d}|_PRINTUNE_MVS_AT BAND={b} USE={[[use + d, 0.5]|max, f]|min}|secondary"
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_button_group_end"
  RESPOND TYPE=command MSG="action:prompt_button Use {'%.1f' % use} mm3/s|_PRINTUNE_PICK STEP=mvs VALUE={'%.1f' % use}|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_PRINTUNE_MVS_UI|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"
  RESPOND MSG="Printune: band {b} = {'%g' % f} mm3/s; use {'%.1f' % use} mm3/s ({'%.0f' % mms} mm/s at 0.2 x 0.45 mm). _PRINTUNE_PICK STEP=mvs VALUE={'%.1f' % use}"

#####################################################################
# Optional log of the picks (needs [save_variables]; never loaded back)
#####################################################################
[gcode_macro _PRINTUNE_SAVE]
description: Printune: log one pick to the save_variables file (no restart, never loaded back)
gcode:
  {% if 'save_variables' in printer %}
    SAVE_VARIABLE VARIABLE={params.KEY} VALUE={params.VALUE}
  {% endif %}

[gcode_macro _PRINTUNE_SAVED]
description: Printune: list the saved picks
gcode:
  {% if 'save_variables' in printer %}
    {% set v = printer.save_variables.variables %}
    RESPOND MSG="Printune saved: {% for k in v if k.startswith('printune_') %}{k[9:]}={v[k]} {% endfor %}"
  {% endif %}
