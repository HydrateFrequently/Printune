# Virtual Kalico printer. Start:  docker compose up -d --build
# Mainsail: http://localhost:8080 (only reachable from this PC)
services:
  printer:
    build:
      context: .
      args:
        BASE: debian:bookworm        # same base as Raspberry Pi OS Lite (bookworm)
    image: virtual-kalico
    container_name: virtual-kalico
    mem_limit: 1g     # it uses about 100 MB
    environment:
      - SPEED=20      # time speed-up of the whole printer; 20 is stable, 1 = real time
      - ACCEL=1       # 1 = fake accelerometer + input shaper on; 0 = a printer without one
      - SHAKETUNE=1   # 1 = Shake&Tune on (needs ACCEL=1); 0 = as if not installed
      - SETUP=1       # 1 = Printune machine setup preset (test values below); 0 = not set, try the setup step
      - SETUP_BED=5,5,370,383          # test values for this virtual printer, not for a real one
      - SETUP_TOOLHEAD=-35,35,-45,40
      - SETUP_GANTRY=40
      - PUID=1000     # your user id and group id on the host (`id -u`, `id -g`),
      - PGID=1000     #   so files in gcodes/ and logs/ stay yours
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # the folder holding printune.cfg (the macros under test), read live
      - ..:/home/pi/host:ro
      - ./gcodes:/home/pi/printer_data/gcodes
      - ./logs:/home/pi/printer_data/logs
      # printer config, variables and Moonraker history survive rebuilds;
      # `docker compose down -v` resets them to the defaults
      - config:/home/pi/printer_data/config
      - database:/home/pi/printer_data/database
    restart: "no"
volumes:
  config:
  database:
