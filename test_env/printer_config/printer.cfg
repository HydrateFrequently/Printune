# Virtual Kalico printer for testing macros and tuning sessions.
# Nebula-370-like CoreXY on a virtual MCU that drives nothing: input pins
# read 1, so endstops trigger at once and homing is instant. Temperatures
# come from sim_thermal (lumped bed / hotend / chamber model).
#
# Step rates are kept low (1 microstep) so the virtual MCU keeps up at a
# 20x time speed-up; motion G-code is unaffected.

[sim_thermal]
ambient: 20
chamber_speedup: 1

[mcu]
serial: /tmp/pseudoserial
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 15
max_z_accel: 200
square_corner_velocity: 5

[stepper_x]
step_pin: PD7
dir_pin: !PC5
enable_pin: !PD6
endstop_pin: ^PC2
microsteps: 1
full_steps_per_rotation: 200
rotation_distance: 40
position_endstop: 0
position_min: 0
position_max: 375
homing_speed: 100
homing_retract_dist: 0

[stepper_y]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PD6
endstop_pin: ^PC3
microsteps: 1
rotation_distance: 40
position_endstop: 0
position_min: 0
position_max: 388
homing_speed: 100
homing_retract_dist: 0

[stepper_z]
step_pin: PB3
dir_pin: PB2
enable_pin: !PA5
endstop_pin: ^PC4
microsteps: 1
rotation_distance: 8
position_endstop: 0
position_min: -2
position_max: 340
homing_speed: 15
homing_retract_dist: 0

[extruder]
step_pin: PB1
dir_pin: !PB0
enable_pin: !PD6
microsteps: 1
rotation_distance: 4.6
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PD5
sensor_type: sim_thermal
control: pid
pid_Kp: 20
pid_Ki: 1.5
pid_Kd: 60
min_temp: -50
max_temp: 300
min_extrude_temp: 170
max_extrude_only_distance: 200
max_extrude_cross_section: 50
pressure_advance: 0.04
pressure_advance_smooth_time: 0.04

[heater_bed]
heater_pin: PD4
sensor_type: sim_thermal
control: pid
pid_Kp: 60
pid_Ki: 1.0
pid_Kd: 600
min_temp: -50
max_temp: 130

[temperature_sensor chamber]
# The "true" chamber temperature of the model, for checking soak logic.
# Real printers usually have no such sensor.
sensor_type: sim_thermal
sim_node: chamber
min_temp: -50
max_temp: 100

[fan]
pin: PB4

[heater_fan hotend_fan]
pin: PB5
heater: extruder
heater_temp: 50

[firmware_retraction]
retract_length: 0.5
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[exclude_object]
[gcode_arcs]

[save_variables]
filename: ~/printer_data/config/variables.cfg

[idle_timeout]
timeout: 1800

[include mainsail.cfg]
[include macros.cfg]
[include ellis_calibration.cfg]
[include ecal_export.cfg]
