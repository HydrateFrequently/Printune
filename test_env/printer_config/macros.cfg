# Minimal Mainsail-style macros for the virtual printer.

[gcode_macro PRINT_START]
description: Simple start: home, heat, prime
gcode:
  {% set BED = params.BED|default(100)|float %}
  {% set EXTRUDER = params.HOTEND|default(params.EXTRUDER)|default(250)|float %}
  G90
  M83
  G28
  M190 S{BED}
  M109 S{EXTRUDER}
  G1 Z5 F900

[gcode_macro PRINT_END]
gcode:
  G91
  G1 E-2 F2400
  G1 Z10 F900
  G90
  TURN_OFF_HEATERS
  M107
