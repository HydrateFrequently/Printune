[supervisord]
nodaemon=true
logfile=/tmp/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:vmcu]
command=bash -c 'exec env LD_PRELOAD=/usr/local/lib/libfaketimeMT.so.1 FAKETIME="+0 x%(ENV_SPEED)s" python3 /home/pi/vmcu/vmcu.py /home/pi/kalico-vmcu/out/klipper.elf /tmp/pseudoserial'
user=pi
environment=HOME="/home/pi",USER="pi"
directory=/home/pi
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/supervisor/vmcu.out
priority=10

[program:klipper]
command=bash -c 'sleep 2; exec env LD_PRELOAD=/usr/local/lib/libfaketimeMT.so.1 FAKETIME="+0 x%(ENV_SPEED)s" /home/pi/klippy-env/bin/python /home/pi/kalico/klippy/klippy.py /home/pi/printer_data/config/printer.cfg -l /home/pi/printer_data/logs/klippy.log -I /home/pi/printer_data/comms/klippy.serial -a /home/pi/printer_data/comms/klippy.sock'
user=pi
environment=HOME="/home/pi",USER="pi"
directory=/home/pi
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/supervisor/klippy.out
priority=20

[program:moonraker]
command=/home/pi/moonraker-env/bin/python /home/pi/moonraker/moonraker/moonraker.py -d /home/pi/printer_data
user=pi
environment=HOME="/home/pi",USER="pi"
directory=/home/pi
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/supervisor/moonraker.out
priority=30

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autorestart=true
priority=40
