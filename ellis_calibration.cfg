#####################################################################
# ellis_calibration.cfg - macros for ECAL (Ellis tuning guide in one session)
#
# Add to printer.cfg:     [include ellis_calibration.cfg]
# Needs in printer.cfg:   [exclude_object]  [pause_resume]  [respond]
#                         [firmware_retraction]  (only if the slice uses firmware retraction)
# Prompts show in Mainsail and recent Fluidd. Without prompt support, the
# console lists the same commands to type (ECAL_PICK ..., ECAL_GO ...).
#
# If you cancel a session half-way, run ECAL_RESET: it puts pressure advance,
# M221 flow, firmware retraction and the idle timeout back.
#
# The session changes PA, flow and retraction only while it runs; at the end the
# printer's own values are back. Per-filament results belong in the Orca filament
# profile (the summary says which field), so swapping filament can't leave a stale
# firmware value behind.
# Optional record: with [save_variables] in printer.cfg every pick is also written
# to that file as you tap it (no restart). It is a log only, never loaded back;
# ECAL_SAVED lists it.
#
# Hands-on tests from the guide (no print needed, run them while the chamber heats):
#   ECAL_EXTRUDE_TEST            Ellis extruder calibration (100 mm at 1 mm/s)
#   ECAL_EXTRUDE_RESULT LEFT=21  -> new rotation_distance from what was left of 120 mm
#   ECAL_FLOW_TEST FLOW=20       Ellis max volumetric flow (100 mm at 20 mm3/s)
#####################################################################

[gcode_macro _ECAL]
description: ECAL state, do not call
variable_version: 5
variable_active: 0
variable_loaded: 0
variable_fw: 1
variable_pa: 0.0
variable_pa0: 0.0
variable_em: 1.0
variable_pfr: 1.0
variable_z0: 0.0
variable_idle0: 600.0
variable_r_len: 0.0
variable_r_speed: 30.0
variable_r_uspeed: 30.0
variable_r_extra: 0.0
variable_ret_len: 0.0
variable_ret_speed: 30.0
variable_ret_temp: 0
variable_rd: 0.0
variable_tested: ''
gcode:
  RESPOND MSG="ECAL state: pa={pa} em={em} retraction={ret_len}mm@{ret_speed} temp={ret_temp}"

[gcode_macro _ECAL_BEGIN]
description: ECAL: start of a session (called by the G-code)
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% set ex = printer.toolhead.extruder %}
  {% set fw = params.FW|default(1)|int %}
  {% if params.VERSION|default(0)|int != S.version %}
    {action_raise_error("ECAL: ellis_calibration.cfg is version %d but this G-code needs version %s - copy the matching cfg" % (S.version, params.VERSION|default('?')))}
  {% endif %}
  {% if fw and 'firmware_retraction' not in printer %}
    {action_raise_error("ECAL: the slice uses firmware retraction but [firmware_retraction] is not in printer.cfg")}
  {% endif %}
  {% if 'exclude_object' not in printer %}
    {action_raise_error("ECAL: add [exclude_object] to printer.cfg")}
  {% endif %}
  {% if 'pause_resume' not in printer %}
    {action_raise_error("ECAL: add [pause_resume] to printer.cfg")}
  {% endif %}
  # A session that was cancelled without ECAL_RESET left test values in the printer:
  # keep the originals it recorded instead of recording the leftovers.
  {% set stale = S.active %}
  {% set pa0 = S.pa0 if stale else printer[ex].pressure_advance %}
  {% set pa = params.PA|default(-1)|float %}
  {% if pa < 0 %}{% set pa = pa0 %}{% endif %}
  {% if stale %}
    RESPOND MSG="ECAL: an unfinished session was found; using the settings it saved from before it."
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=active VALUE=1
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=fw VALUE={fw}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=pa0 VALUE={pa0}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=pa VALUE={pa}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=em VALUE={params.EM|default(1)|float}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=ret_len VALUE=0.0
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=ret_temp VALUE=0
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=tested VALUE="''"
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=pfr VALUE={params.PFR|default(1)|float}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=z0 VALUE={printer.gcode_move.homing_origin.z}
  {% if not stale %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=idle0 VALUE={printer.idle_timeout.idle_timeout|default(600)|float}
  {% endif %}
  {% if fw and not (stale and S.fw) %}
    {% set r = printer.firmware_retraction %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=r_len VALUE={r.retract_length}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=r_speed VALUE={r.retract_speed}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=r_uspeed VALUE={r.unretract_speed}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=r_extra VALUE={r.unretract_extra_length}
  {% endif %}
  # Arm exclude_object now: it lets the first 5 extrusions after its first EXCLUDE_OBJECT
  # through, which would otherwise leak into the first optional part you skip.
  EXCLUDE_OBJECT NAME=_ECAL_ARM
  EXCLUDE_OBJECT RESET=1 NAME=_ECAL_ARM
  # pauses between tests must not trip the idle timeout (it would turn the heaters off)
  SET_IDLE_TIMEOUT TIMEOUT=10800
  SET_PRESSURE_ADVANCE ADVANCE={pa}
  M221 S{params.EM|default(1)|float * 100}
  RESPOND MSG="ECAL: session started (PA {pa}, EM {params.EM|default(1)}). If you cancel, run ECAL_RESET."

[gcode_macro _ECAL_APPLY]
description: ECAL: apply the picked PA and EM
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  SET_PRESSURE_ADVANCE ADVANCE={S.pa}
  M221 S{S.em * 100}

[gcode_macro _ECAL_PA_REL]
description: ECAL: PA = picked value + D (fine pattern)
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  SET_PRESSURE_ADVANCE ADVANCE={[S.pa + params.D|float, 0]|max}

[gcode_macro _ECAL_EM_REL]
description: ECAL: EM = picked value + D (fine cubes)
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  M221 S{(S.em + params.D|float) * 100}

[gcode_macro _ECAL_RET_SET]
description: ECAL: retraction for the next tower ring (length is real mm, M221 is compensated)
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% set L = params.LEN|float %}
  {% set V = params.SPEED|default(30)|float %}
  {% set ef = printer.gcode_move.extrude_factor %}
  # a skipped tower still runs its macros: don't let it record a ring as tested
  {% if printer.exclude_object.current_object not in printer.exclude_object.excluded_objects %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=ret_len VALUE={L}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=ret_speed VALUE={V}
  {% endif %}
  {% if S.fw %}
    SET_RETRACTION RETRACT_LENGTH={L / ef} RETRACT_SPEED={V} UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED={V}
  {% endif %}
  M117 retraction {L} mm

[gcode_macro _ECAL_RET_RESTORE]
description: ECAL: firmware retraction back to the values from before the session
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% if S.fw and 'firmware_retraction' in printer %}
    SET_RETRACTION RETRACT_LENGTH={S.r_len} RETRACT_SPEED={S.r_speed} UNRETRACT_EXTRA_LENGTH={S.r_extra} UNRETRACT_SPEED={S.r_uspeed}
  {% endif %}

[gcode_macro _ECAL_R]
description: ECAL: slicer-style retract during the tower test (no firmware retraction)
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% if S.ret_len > 0 %}
    G1 E-{S.ret_len / printer.gcode_move.extrude_factor} F{S.ret_speed * 60}
  {% endif %}

[gcode_macro _ECAL_U]
description: ECAL: slicer-style unretract during the tower test
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% if S.ret_len > 0 %}
    G1 E{S.ret_len / printer.gcode_move.extrude_factor} F{S.ret_speed * 60}
  {% endif %}

[gcode_macro _ECAL_TEMP]
description: ECAL: set and wait for a tower temperature unless that tower was cancelled
gcode:
  {% if params.OBJ|upper not in printer.exclude_object.excluded_objects %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=ret_temp VALUE={params.S|int}
    M117 tower {params.S|int}C
    M109 S{params.S|int}
  {% endif %}

[gcode_macro _ECAL_END]
description: ECAL: put everything back (keeps the babystep so you can save it)
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  SET_PRESSURE_ADVANCE ADVANCE={S.pa0}
  M221 S100
  _ECAL_SAVE KEY=ecal_z_babystep VALUE={'%.4f' % (printer.gcode_move.homing_origin.z - S.z0)}
  _ECAL_RET_RESTORE
  SET_IDLE_TIMEOUT TIMEOUT={S.idle0}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=active VALUE=0

[gcode_macro ECAL_RESET]
description: ECAL: undo session settings after a cancelled session
gcode:
  {% if printer["gcode_macro _ECAL"].active %}
    _ECAL_END
  {% else %}
    M221 S100
    RESPOND MSG="ECAL: no unfinished session found (after a restart the printer already uses its config values). Flow set back to 100 %."
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=tested VALUE="''"
  RESPOND TYPE=command MSG="action:prompt_end"

#####################################################################
# Checkpoints and buttons
#####################################################################
[gcode_macro _ECAL_CP]
description: ECAL: pause and ask for the result of the test just printed
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% set step = params.STEP|lower %}
  {% set obj = params.OBJ|default('')|upper %}
  {% set skip = params.SKIP|default('') %}
  {% set dz = printer.gcode_move.homing_origin.z - S.z0 %}
  {% set excl = printer.exclude_object.excluded_objects %}
  {% set objs = params.ALL|default('')|upper %}
  {% set skipped = (obj and obj in excl) or (objs and objs.split(',')|reject('in', excl)|list|length == 0) %}
  {% if skipped %}
    RESPOND MSG="ECAL: {step} was skipped"
    {% if step == 'ret' %}
      _ECAL_SUMMARY
    {% endif %}
  {% else %}
    {% if step == 'squish' or step == 'squish2' %}
      RESPOND TYPE=command MSG="action:prompt_begin ECAL 1/4 - First layer squish"
      RESPOND TYPE=command MSG="action:prompt_text Look at the patches. Good squish: no gaps between lines, lines still clearly visible (not smooth or wavy). Babystep so far: {'%.3f' % dz} mm."
      RESPOND TYPE=command MSG="action:prompt_text Do not babystep while paused (RESUME restores the paused Z)."
      {% if step == 'squish' and skip %}
        RESPOND TYPE=command MSG="action:prompt_button Squish is good - go to pressure advance|ECAL_GO SKIP={skip}|primary"
        RESPOND TYPE=command MSG="action:prompt_button Print 4 more patches|ECAL_GO|secondary"
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_button Continue to pressure advance|ECAL_GO|primary"
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="ECAL: paused. Type ECAL_GO to continue{(' or ECAL_GO SKIP=' ~ skip ~ ' to skip the extra patches') if skip else ''}."
      PAUSE
    {% elif step == 'pa' or step == 'em' %}
      {% set vals = params.VALUES.split(',') %}
      {% if step == 'pa' %}
        RESPOND TYPE=command MSG="action:prompt_begin ECAL 2/4 - Pressure advance"
        RESPOND TYPE=command MSG="action:prompt_text Pick the sharpest corner with the fewest gaps or bulges. If unsure, lean to the higher value (Ellis). Numbers are printed on every other pattern."
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin ECAL 3/4 - Extrusion multiplier"
        RESPOND TYPE=command MSG="action:prompt_text Judge the centre of each top surface: smoothest without ridges, no gaps or valleys. If unsure, pick the higher one (Ellis). Labels are EM in %."
        RESPOND TYPE=command MSG="action:prompt_text Also check pinholes where the top infill meets the walls (Ellis infill/perimeter overlap)."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for v in vals %}
        {% set lab = (v|float * 100)|round(1) if step == 'em' else v %}
        RESPOND TYPE=command MSG="action:prompt_button {lab}|ECAL_PICK STEP={step} VALUE={v}{(' SKIP=' ~ skip) if skip else ''}|primary"
        {% if loop.index % 4 == 0 and not loop.last %}
          RESPOND TYPE=command MSG="action:prompt_button_group_end"
          RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="ECAL: paused. Type ECAL_PICK STEP={step} VALUE=<value>{(' SKIP=' ~ skip) if skip else ''}"
      PAUSE
    {% elif step == 'pa_fine' or step == 'em_fine' %}
      {% set offs = params.OFFSETS.split(',') %}
      {% set base = S.pa if step == 'pa_fine' else S.em %}
      {% if step == 'pa_fine' %}
        RESPOND TYPE=command MSG="action:prompt_begin ECAL 2/4 - Pressure advance, fine"
        RESPOND TYPE=command MSG="action:prompt_text Labels are offsets in 0.001 from your pick ({base}). Pick the sharpest corner."
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_begin ECAL 3/4 - Extrusion multiplier, fine"
        RESPOND TYPE=command MSG="action:prompt_text Labels are offsets in % from your pick ({'%.3f' % base}). Pick the smoothest top."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for o in offs if base + o|float > -0.00001 %}
        {% set v = [base + o|float, 0]|max %}
        {% set vs = ('%.4f' % v) %}
        {% set lab = (('%+.0f' % (o|float * 1000)) if step == 'pa_fine' else ('%+.1f' % (o|float * 100))) ~ ' = ' ~ (('%.3f' % v) if step == 'pa_fine' else ('%.3f' % v)) %}
        RESPOND TYPE=command MSG="action:prompt_button {lab}|ECAL_PICK STEP={step} VALUE={vs}|primary"
        {% if loop.index % 3 == 0 and not loop.last %}
          RESPOND TYPE=command MSG="action:prompt_button_group_end"
          RESPOND TYPE=command MSG="action:prompt_button_group_start"
        {% endif %}
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="ECAL: paused. Type ECAL_PICK STEP={step} VALUE=<value>"
      PAUSE
    {% elif step == 'ret_ask' %}
      RESPOND TYPE=command MSG="action:prompt_begin ECAL 4/4 - Retraction towers?"
      RESPOND TYPE=command MSG="action:prompt_text Ellis: retraction tuning is often unnecessary (direct drive: 0.5 mm at 35 mm/s is a good start). Print the towers only if you see stringing."
      RESPOND TYPE=command MSG="action:prompt_text Before printing them: brush the nozzle clean. Towers print one at a time, hottest first."
      RESPOND TYPE=command MSG="action:prompt_button Print the retraction towers|ECAL_GO|primary"
      RESPOND TYPE=command MSG="action:prompt_button Skip them and finish|ECAL_GO SKIP={skip}|secondary"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="ECAL: paused. Type ECAL_GO (towers) or ECAL_GO SKIP={skip} (finish)."
      PAUSE
    {% elif step == 'ret' %}
      {% set temps = params.TEMPS.split(',') %}
      RESPOND TYPE=command MSG="action:prompt_begin ECAL 4/4 - Retraction"
      RESPOND TYPE=command MSG="action:prompt_text Pick the tower (temperature) with the least stringing. If the hotter towers are much stringier, pick a cooler one (Ellis)."
      RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% for t in temps %}
        RESPOND TYPE=command MSG="action:prompt_button {t} C|ECAL_PICK STEP=ret_temp VALUE={t} RINGS={params.RINGS}|primary"
      {% endfor %}
      RESPOND TYPE=command MSG="action:prompt_button_group_end"
      RESPOND TYPE=command MSG="action:prompt_show"
      RESPOND MSG="ECAL: type ECAL_PICK STEP=ret_temp VALUE=<temp> RINGS={params.RINGS}"
    {% else %}
      _ECAL_SUMMARY
    {% endif %}
  {% endif %}

[gcode_macro ECAL_PICK]
description: ECAL: record a picked value (prompt buttons call this)
gcode:
  {% set step = params.STEP|lower %}
  {% set v = params.VALUE|float %}
  {% set skip = params.SKIP|default('') %}
  {% set S = printer["gcode_macro _ECAL"] %}
  {% set kind = 'pa' if step in ['pa', 'pa_fine'] else ('em' if step in ['em', 'em_fine'] else ('ret' if step == 'ret' else '')) %}
  {% if kind and kind not in S.tested.split(',') %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=tested VALUE="'{(S.tested ~ ',' ~ kind).strip(',')}'"
  {% endif %}
  {% if step in ['pa', 'pa_fine'] %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=pa VALUE={v}
    _ECAL_SAVE KEY=ecal_pa VALUE={v}
  {% elif step in ['em', 'em_fine'] %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=em VALUE={v}
    _ECAL_SAVE KEY=ecal_em VALUE={v}
  {% elif step == 'ret_temp' %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=ret_temp VALUE={v|int}
    _ECAL_SAVE KEY=ecal_ret_temp VALUE={v|int}
  {% elif step == 'ret' %}
    SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=ret_len VALUE={v}
    _ECAL_SAVE KEY=ecal_ret_len VALUE={v}
    _ECAL_SAVE KEY=ecal_ret_speed VALUE={S.ret_speed}
  {% endif %}
  RESPOND MSG="ECAL: {step} = {params.VALUE}"
  {% if step in ['pa', 'em'] and skip %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin ECAL - fine pass?"
    {% if step == 'pa' %}
      RESPOND TYPE=command MSG="action:prompt_text Picked PA {params.VALUE}. Ellis re-runs the pattern in 0.001-0.002 steps around the pick. Optional."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Picked EM {'%.3f' % v}. Ellis re-runs the cubes in 0.5 % steps around the pick. Optional."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Print the fine pass|ECAL_GO|primary"
    RESPOND TYPE=command MSG="action:prompt_button Skip it, keep {params.VALUE}|ECAL_GO SKIP={skip}|secondary"
    RESPOND TYPE=command MSG="action:prompt_show"
    RESPOND MSG="ECAL: type ECAL_GO (fine pass) or ECAL_GO SKIP={skip} (skip it)"
  {% elif step == 'ret_temp' %}
    {% set rings = params.RINGS.split(',') %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=command MSG="action:prompt_begin ECAL 4/4 - Retraction length ({v|int} C)"
    RESPOND TYPE=command MSG="action:prompt_text Count the rings from the bottom (ring 1 = no retraction). Pick 1-2 rings above where the stringing stops (Ellis)."
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    {% for r in rings %}
      RESPOND TYPE=command MSG="action:prompt_button {loop.index}: {r} mm|ECAL_PICK STEP=ret VALUE={r}|primary"
      {% if loop.index % 4 == 0 and not loop.last %}
        RESPOND TYPE=command MSG="action:prompt_button_group_end"
        RESPOND TYPE=command MSG="action:prompt_button_group_start"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"
    RESPOND MSG="ECAL: type ECAL_PICK STEP=ret VALUE=<mm>"
  {% elif step == 'ret' %}
    RESPOND TYPE=command MSG="action:prompt_end"
    _ECAL_SUMMARY
  {% else %}
    ECAL_GO
  {% endif %}

[gcode_macro ECAL_GO]
description: ECAL: continue the session; SKIP=obj1,obj2 cancels optional parts first
gcode:
  {% for o in (params.SKIP|default('')).upper().split(',') %}
    {% if o %}
      EXCLUDE_OBJECT NAME={o}
    {% endif %}
  {% endfor %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if printer.pause_resume.is_paused %}
    RESUME
  {% endif %}

[gcode_macro _ECAL_SUMMARY]
description: ECAL: show the picked values and where to save them
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% set dz = printer.gcode_move.homing_origin.z - S.z0 %}
  {% set tested = S.ret_temp > 0 %}
  {% set rline = ("retraction %.2f mm @ %.0f mm/s | tower temp %d C" % (S.ret_len, S.ret_speed, S.ret_temp)) if tested else "retraction not tested (keep yours)" %}
  {% set line = "PA %.4f | EM %.3f (Orca flow ratio %.3f) | %s | babystep %+.3f mm" % (S.pa, S.em, S.em / (S.pfr or 1.0), rline, dz) %}
  RESPOND MSG="ECAL results: {line}"
  {% set exp = 'ecal_export' in printer and S.tested %}
  {% if exp %}
    ECAL_EXPORT SOFT=1
  {% endif %}
  {% if not params.QUIET|default(0)|int %}
    _ECAL_SUMMARY_PROMPT EXPORT={1 if exp else 0}
  {% endif %}

[gcode_macro _ECAL_SUMMARY_PROMPT]
description: ECAL: the results prompt (runs after ECAL_EXPORT so it can name the file)
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% set dz = printer.gcode_move.homing_origin.z - S.z0 %}
  {% set tested = S.ret_temp > 0 %}
  {% set rline = ("retraction %.2f mm @ %.0f mm/s | tower temp %d C" % (S.ret_len, S.ret_speed, S.ret_temp)) if tested else "retraction not tested (keep yours)" %}
  {% set line = "PA %.4f | EM %.3f (Orca flow ratio %.3f) | %s | babystep %+.3f mm" % (S.pa, S.em, S.em / (S.pfr or 1.0), rline, dz) %}
  RESPOND TYPE=command MSG="action:prompt_begin ECAL results"
  RESPOND TYPE=command MSG="action:prompt_text {line}"
  {% if params.EXPORT|int and printer.ecal_export.last_name %}
    RESPOND TYPE=command MSG="action:prompt_text Orca filament preset written: {printer.ecal_export.last_rel}. Download it in Mainsail (Machine tab) and import it in Orca with File > Import > Import Configs. The printer's own values are back now."
    RESPOND TYPE=command MSG="action:prompt_text Or type them in this filament's Orca profile yourself:"
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text Put these in this filament's Orca profile (the printer's own values are back now):"
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_text Filament > Flow ratio: {'%.3f' % (S.em / (S.pfr or 1.0))}. Filament > Pressure advance: tick Enable, {'%.4f' % S.pa}."
  {% if tested %}
    {% if S.fw %}
      RESPOND TYPE=command MSG="action:prompt_text Retraction (firmware retraction is global, so set it per filament): Advanced > Filament start G-code: SET_RETRACTION RETRACT_LENGTH={'%.2f' % S.ret_len} RETRACT_SPEED={'%.0f' % S.ret_speed} UNRETRACT_EXTRA_LENGTH=0 UNRETRACT_SPEED={'%.0f' % S.ret_speed}  (give every filament profile its own line)."
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Setting overrides > Retraction length {'%.2f' % S.ret_len}, Retraction and Deretraction speed {'%.0f' % S.ret_speed}."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_text Filament > Nozzle temperature: {S.ret_temp} C, if that tower was clearly cleaner than the others."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_text Squish: if your start macro does not set its own Z offset, Z_OFFSET_APPLY_PROBE then SAVE_CONFIG stores the babystep (Ellis). Check your Beacon mode first."
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|primary"
  RESPOND TYPE=command MSG="action:prompt_show"

#####################################################################
# Hands-on tests (Ellis extruder calibration and max volumetric flow)
#####################################################################
[gcode_macro ECAL_EXTRUDE_TEST]
description: Ellis extruder calibration - mark the filament 120 mm above the extruder first
gcode:
  {% set L = params.LENGTH|default(100)|float %}
  {% set V = params.SPEED|default(1)|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set c = printer.configfile.settings[ex] %}
  {% if c.max_extrude_only_distance < L + 1 %}
    {action_raise_error("ECAL: set max_extrude_only_distance: %d in [%s] and RESTART" % (L + 1, ex))}
  {% endif %}
  {% if printer[ex].temperature < c.min_extrude_temp %}
    {action_raise_error("ECAL: heat the hotend first (or set min_extrude_temp: 0 for a cold test)")}
  {% endif %}
  SAVE_GCODE_STATE NAME=_ecal_ext
  M221 S100
  M83
  G1 E{L} F{V * 60}
  M400
  RESTORE_GCODE_STATE NAME=_ecal_ext
  RESPOND MSG="ECAL: extruded {L} mm at {V} mm/s. Measure what is left of the 120 mm mark, then ECAL_EXTRUDE_RESULT LEFT=<mm>"

[gcode_macro ECAL_EXTRUDE_RESULT]
description: Ellis: new rotation_distance from the length left of the 120 mm mark
gcode:
  {% set S = printer["gcode_macro _ECAL"] %}
  {% set ex = printer.toolhead.extruder %}
  {% set rd = S.rd if S.rd > 0 else printer.configfile.settings[ex].rotation_distance %}
  {% set actual = 120 - params.LEFT|float %}
  {% set new = rd * actual / params.LENGTH|default(100)|float %}
  SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER={ex} DISTANCE={new}
  SET_GCODE_VARIABLE MACRO=_ECAL VARIABLE=rd VALUE={new}
  _ECAL_SAVE KEY=ecal_rotation_distance VALUE={'%.5f' % new}
  RESPOND MSG="ECAL: extruded {actual} mm -> rotation_distance {rd} -> {'%.5f' % new} (active until the next restart). Repeat the test until it lands on 100 mm, then put it in [{ex}] rotation_distance in printer.cfg (it is the same for every filament) and RESTART."

[gcode_macro ECAL_FLOW_TEST]
description: Ellis max volumetric flow - extrude 100 mm at FLOW mm3/s, then check 100 mm went in
gcode:
  {% set F = params.FLOW|default(10)|float %}
  {% set L = params.LENGTH|default(100)|float %}
  {% set ex = printer.toolhead.extruder %}
  {% set c = printer.configfile.settings[ex] %}
  {% set area = 3.14159265 * (c.filament_diameter / 2) ** 2 %}
  {% set v = F / area %}
  {% if c.max_extrude_only_distance < L + 1 %}
    {action_raise_error("ECAL: set max_extrude_only_distance: %d in [%s] and RESTART" % (L + 1, ex))}
  {% endif %}
  {% if v > c.max_extrude_only_velocity %}
    {action_raise_error("ECAL: %.1f mm/s is above max_extrude_only_velocity (%.1f)" % (v, c.max_extrude_only_velocity))}
  {% endif %}
  {% if printer[ex].temperature < c.min_extrude_temp %}
    {action_raise_error("ECAL: heat the hotend first")}
  {% endif %}
  SAVE_GCODE_STATE NAME=_ecal_flow
  M221 S100
  M83
  G1 E{L} F{v * 60}
  M400
  RESTORE_GCODE_STATE NAME=_ecal_flow
  RESPOND MSG="ECAL: {L} mm at {'%.2f' % v} mm/s = {F} mm3/s. Ellis: keep raising FLOW until less than 100 mm goes in (2-3 % drop-off is his limit), then set a slightly lower value as Orca 'Max volumetric speed'."

#####################################################################
# Optional log of the picks (needs [save_variables]; never loaded back)
#####################################################################
[gcode_macro _ECAL_SAVE]
description: ECAL: log one pick to the save_variables file (no restart, never loaded back)
gcode:
  {% if 'save_variables' in printer %}
    SAVE_VARIABLE VARIABLE={params.KEY} VALUE={params.VALUE}
  {% endif %}

[gcode_macro ECAL_SAVED]
description: ECAL: list the saved picks
gcode:
  {% if 'save_variables' in printer %}
    {% set v = printer.save_variables.variables %}
    RESPOND MSG="ECAL saved: {% for k in v if k.startswith('ecal_') %}{k[5:]}={v[k]} {% endfor %}"
  {% endif %}
